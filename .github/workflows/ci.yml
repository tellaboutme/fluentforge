name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff format --check apps/api scripts services/worker tests
          uv run ruff check apps/api scripts services/worker tests

      - name: Typecheck
        run: uv run mypy apps/api/app scripts

      - name: Validate curriculum
        run: uv run python scripts/validate_curriculum.py

      - name: Tests
        run: uv run pytest -q

  web:
    name: Web app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      # Includes the cross-stack contract tests, which fail if the API renames
      # or drops a field the web app depends on.
      - name: Tests
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm --filter web build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --extra dev
          pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Playwright starts the API and the web server itself.
      - name: Run E2E
        run: pnpm --filter web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  fixtures:
    name: API fixtures are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # A stale fixture means the web contract tests are asserting against a
      # shape the API no longer sends.
      - name: Re-capture and diff
        run: |
          uv run python scripts/capture_api_fixtures.py
          git diff --exit-code apps/web/fixtures/api-payloads.json \
            || (echo "::error::API payloads changed. Run 'make capture-fixtures' and commit." && exit 1)

  postgres:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fluentforge
          POSTGRES_USER: fluentforge
          POSTGRES_PASSWORD: fluentforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluentforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://fluentforge:fluentforge@localhost:5432/fluentforge

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # SQLite is the dev default, so PostgreSQL compatibility must be proven here.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Load curriculum
        run: uv run python scripts/load_curriculum.py --publish

      - name: Reject schema drift
        run: |
          uv run alembic check
          uv run alembic downgrade base
