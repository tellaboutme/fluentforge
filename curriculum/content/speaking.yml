version: 0.1.0
description: >
  Spoken output tasks. The learner speaks; the browser transcribes; the
  transcript is checked against the same countable properties writing uses.

  What this can evidence: that connected spoken language was produced, at
  length, covering what the task asked for. What it cannot evidence is
  pronunciation. A transcript is normalised text and cannot tell a clearly
  spoken word from a badly spoken one the recogniser guessed correctly, so no
  task here targets a pronunciation skill and the parser refuses one that
  tries (apps/api/app/curriculum/speaking.py).

  Recognition confidence is stored and never scored. Browser speech
  recognition is less accurate on accented and non-native speech — this
  product's whole audience — so a low-confidence transcript may mean unclear
  speech, a poor microphone, or a recogniser trained mostly on native
  speakers. Marking a learner down for the third would be discrimination
  dressed as assessment.

  Every task states a preparation time. Planning time changes what a speaking
  task measures, so it belongs in the content rather than in the UI.

  All prompts are original to this repository.

tasks:
  # --- A1 -----------------------------------------------------------------
  - key: speak.a1.introduce_yourself
    level: A1
    skill: speaking.basic_identity
    title: "Introduce yourself out loud"
    format: monologue
    minutes: 6
    preparation_seconds: 45
    min_seconds: 25
    max_seconds: 90
    min_words: 35
    prompt: |
      You are meeting a new class for the first time. Everyone says a little
      about themselves.

      Say who you are, where you are from, where you live now, and one thing
      you like doing.
    guidance:
      - "Speak in full sentences, even short ones."
      - "It is fine to pause and think. Silence is not a mistake."
      - "Say where you live and where you are from -- both, not just one."
    required_elements: ["live", "from"]
    target_features:
      - grammar.tense.present_simple_form
      - grammar.agreement.subject_verb

  # --- A2 -----------------------------------------------------------------
  - key: speak.a2.weekend
    level: A2
    skill: speaking.simple_description
    title: "Tell someone about your weekend"
    format: narrative
    minutes: 7
    preparation_seconds: 45
    min_seconds: 35
    max_seconds: 120
    min_words: 55
    prompt: |
      A colleague asks what you did at the weekend.

      Tell them. Say where you went or what you did, who you were with, and
      whether you enjoyed it.
    guidance:
      - "Use past forms: went, saw, had, was."
      - "Join your ideas with 'and', 'but', 'so' or 'because'."
      - "Say whether you enjoyed it, and why."
    required_elements: ["because"]
    target_features:
      - grammar.tense.past_simple_form
      - discourse.cohesion.connective

  # --- B1 -----------------------------------------------------------------
  - key: speak.b1.explain_a_problem
    level: B1
    skill: speaking.connected_narrative
    title: "Explain a problem and what you did about it"
    format: narrative
    minutes: 9
    preparation_seconds: 60
    min_seconds: 60
    max_seconds: 180
    min_words: 90
    prompt: |
      Think of something that went wrong recently -- a delivery, an
      appointment, a piece of equipment, anything.

      Explain what happened, in order: what should have happened, what
      actually happened, what you did about it, and how it ended.
    guidance:
      - "Keep the order clear so the listener can follow without asking."
      - "Signal the sequence: first, then, after that, in the end."
      - "Say how it ended, even if it is still unresolved."
    required_elements: ["then"]
    target_features:
      - grammar.tense.perfect_vs_past
      - discourse.cohesion.connective
      - discourse.reference.given_new

  # --- B2 -----------------------------------------------------------------
  - key: speak.b2.defend_a_view
    level: B2
    skill: speaking.develop_viewpoint
    title: "Argue a position, and answer the obvious objection"
    format: opinion
    minutes: 12
    preparation_seconds: 90
    min_seconds: 75
    max_seconds: 210
    min_words: 130
    prompt: |
      Should employers be allowed to require staff back in the office full
      time?

      Take a position and argue it. Give two reasons with some development,
      then state the strongest objection to your own view and answer it.
    guidance:
      - "State your position early, not as a conclusion at the end."
      - "Develop each reason -- a claim with no support is not an argument."
      - "Give the objection its real force before you answer it. However you
        frame it, do not caricature it."
      - "Signposting helps a listener more than a reader: 'my first reason
        is', 'the obvious objection is'."
    required_elements: ["however"]
    target_features:
      - grammar.clause.subordination
      - grammar.modality.obligation
      - discourse.organisation.paragraphing
      - lexis.precision.approximation

  # --- C1 -----------------------------------------------------------------
  - key: speak.c1.summarise_and_react
    level: C1
    skill: mediation.complex_synthesis
    title: "Pass on an argument, then say where you stand"
    format: summary
    minutes: 14
    preparation_seconds: 120
    min_seconds: 90
    max_seconds: 240
    min_words: 160
    prompt: |
      A colleague missed a discussion you both needed. The argument made was
      that remote work has made informal learning harder, because people no
      longer overhear how colleagues handle problems.

      Report that argument fairly and in your own words, mark clearly where
      the report ends and your own view begins, and say what you would do
      about it.
    guidance:
      - "Report, do not recite. Your own sentences, their argument."
      - "Mark the source explicitly: 'the argument was that...'."
      - "Signal the handover clearly -- 'for my part' or similar -- so the
        listener always knows whose view they are hearing."
      - "Hedge what you are unsure of; commit plainly to what you are not."
    required_elements: ["argument"]
    target_features:
      - grammar.tense.sequence_backshift
      - discourse.reference.given_new
      - pragmatics.register.formality
      - lexis.precision.approximation

  # --- C2 -----------------------------------------------------------------
  #
  # The bank stopped at C1, which `docs/ROADMAP.md` Milestone 7 names as
  # exactly the gap: the top band is where meetings, debates and
  # presentations live, and none of them is a longer version of describing
  # your weekend.
  #
  # Both tasks below are roleplays with a listener who is not in the room.
  # That is a real limitation and it is what shapes them: a transcript
  # cannot evidence turn-taking or repair, so neither task claims to. What
  # they do evidence is what a C2 speaker does *while* holding the floor --
  # conceding a point without losing it, and keeping an argument alive under
  # a constraint the speaker states out loud.
  - key: speak.c2.concede_and_hold
    level: C2
    skill: speaking.precise_spontaneous
    title: "Concede the strongest point against you"
    format: opinion
    minutes: 12
    preparation_seconds: 90
    min_seconds: 100
    max_seconds: 240
    min_words: 180
    prompt: |
      You are arguing in a meeting that your team should keep its shared
      office. Someone has just made the strongest argument against you: most
      of the team commute over an hour, and the office costs more than
      anything except salaries.

      Answer them. Concede that point properly -- not as a formality -- and
      then say why you still hold your position.
    guidance:
      - "Concede the actual point, in your own words, before you answer it."
      - "A concession you take back in the next clause is not a concession."
      - "Separate what you can show from what you believe, and mark which is which."
      - "Stay on your position. Answering a weaker argument instead is the
        commonest way this goes wrong."
    required_elements: ["position"]
    target_features:
      - pragmatics.stance.hedging
      - pragmatics.attribution.source
      - discourse.organisation.information_flow
      - grammar.clause.subordination

  - key: speak.c2.brief_under_a_constraint
    level: C2
    skill: mediation.reconstruct_multisource
    title: "Brief someone in ninety seconds"
    format: summary
    minutes: 12
    preparation_seconds: 120
    min_seconds: 90
    max_seconds: 180
    min_words: 170
    prompt: |
      Someone is about to walk into a decision you have been following and
      they have ninety seconds. Three things are true: the finance case is
      strong, the staff survey is mixed, and the people closest to the work
      disagree with both.

      Brief them. Say what is at issue, what each position rests on, and what
      you would need to know to settle it.
    guidance:
      - "Order it for them, not for you. What do they need first?"
      - "Attribute every claim: they cannot tell your reasoning from a
        source's unless you say."
      - "Say plainly what is not known. A confident briefing that hides a gap
        is worse than a hesitant one."
      - "Ninety seconds is the constraint. Leaving something out on purpose
        is part of the task."
    required_elements: ["issue"]
    target_features:
      - pragmatics.attribution.source
      - pragmatics.stance.hedging
      - discourse.organisation.information_flow
      - lexis.precision.approximation
