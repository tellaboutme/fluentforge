version: 0.1.0
description: >
  Short listening clips, each with gist, detail, and inference questions.
  Meaning-focused, like the reading library: the learner listens for the
  message first, and the questions follow.

  No audio files ship with this repository. Each clip carries a transcript and
  the client speaks it with the browser's own speech synthesis, so the
  listening lab works offline, with no AI key, and with no licensing question.
  That is a real compromise: synthetic speech under-represents the weak forms
  and elision that make real listening hard, so a learner who copes here has
  not yet proved they cope with a recording of two people talking. The
  limitation is recorded in docs/CURRENT_STATUS.md rather than hidden.

  Set `audio` on a clip to point at a real recording; the client prefers it
  when present. No schema change is needed to move to recorded audio.

  Transcripts are written to be *heard*, not read: contractions, false starts,
  and the way people actually open and close a conversation. All content is
  original to this repository.

clips:
  # --- A1 -----------------------------------------------------------------
  - key: listen.a1.station_announcement
    level: A1
    skill: listening.basic_personal
    title: "An announcement at the station"
    setting: "A loudspeaker announcement on a train platform."
    minutes: 4
    speech_rate: 0.8
    transcript: |
      Attention please. The ten fifteen train to Brighton
      will leave from platform four, not platform two.
      I repeat: platform four.
      The train is running about ten minutes late.
      We are sorry for the delay.
    questions:
      - key: gist
        type: gist
        prompt: "What is the announcement mainly about?"
        options:
          - "A train is leaving from a different platform."
          - "A train has been cancelled."
          - "The station is closing early."
          - "A new train has been added."
        answer: "A train is leaving from a different platform."
      - key: detail
        type: detail
        prompt: "Which platform should passengers go to?"
        options: ["Platform four", "Platform two", "Platform ten", "Platform fifteen"]
        answer: "Platform four"
      - key: inference
        type: inference
        prompt: "What will passengers probably have to do?"
        options:
          - "Wait a little longer than they expected."
          - "Buy a new ticket."
          - "Travel on a different day."
          - "Take a bus instead."
        answer: "Wait a little longer than they expected."

  # --- A2 -----------------------------------------------------------------
  - key: listen.a2.voicemail
    level: A2
    skill: listening.routine_messages
    title: "A voicemail from a friend"
    setting: "A message left on your phone by a friend, Nadia."
    minutes: 5
    speech_rate: 0.85
    transcript: |
      Hi, it's Nadia. Listen, about Saturday —
      I can't make lunch after all. My sister's coming
      down from Leeds and I said I'd meet her at the station.
      I'm really sorry, I know you booked the table.
      Could we do Sunday instead? Any time after eleven
      works for me. Give me a ring when you get this. Bye!
    questions:
      - key: gist
        type: gist
        prompt: "Why is Nadia calling?"
        options:
          - "To change the day of their meeting."
          - "To invite her sister to lunch."
          - "To book a table at a restaurant."
          - "To ask for a lift to the station."
        answer: "To change the day of their meeting."
      - key: detail
        type: detail
        prompt: "Who is Nadia meeting on Saturday?"
        options: ["Her sister", "Her sister's friend", "Nobody", "The restaurant manager"]
        answer: "Her sister"
      - key: inference
        type: inference
        prompt: "How does Nadia feel about changing the plan?"
        options:
          - "Apologetic — she knows it causes trouble."
          - "Annoyed with her friend."
          - "Completely unbothered."
          - "Worried that her sister will be late."
        answer: "Apologetic — she knows it causes trouble."

  # --- B1 -----------------------------------------------------------------
  - key: listen.b1.colleague_handover
    level: B1
    skill: listening.main_points_standard
    title: "A handover before a holiday"
    setting: "A colleague, Tom, explaining what to cover while he is away."
    minutes: 7
    speech_rate: 0.95
    transcript: |
      Right, so, two things while I'm away.
      The Renfrew report — it's basically done, but the
      figures for March haven't come back from finance yet.
      When they do, just drop them into the table on page six.
      Don't rewrite the summary, I'll do that when I'm back.
      The other thing is Priya's team. They'll ask about
      the new deadline. Tell them it hasn't moved, whatever
      they've heard. If they push, send them to Dan, not to me —
      I genuinely will not have signal.
    questions:
      - key: gist
        type: gist
        prompt: "What is Tom doing?"
        options:
          - "Explaining what to handle while he is away."
          - "Asking for help finishing a report."
          - "Complaining about a missed deadline."
          - "Introducing a new member of the team."
        answer: "Explaining what to handle while he is away."
      - key: detail
        type: detail
        prompt: "What should be done with the March figures?"
        options:
          - "Add them to the table on page six."
          - "Rewrite the summary around them."
          - "Send them to Priya's team."
          - "Wait until Tom returns."
        answer: "Add them to the table on page six."
      - key: inference
        type: inference
        prompt: "Why does Tom say to send people to Dan?"
        options:
          - "He will be unreachable while away."
          - "Dan wrote the report."
          - "He does not get on with Priya."
          - "Dan set the original deadline."
        answer: "He will be unreachable while away."

  - key: listen.b1.radio_weather
    level: B1
    skill: listening.main_points_standard
    title: "A weekend weather forecast"
    setting: "A short forecast at the end of a radio news bulletin."
    minutes: 5
    speech_rate: 1.0
    transcript: |
      And now the weekend weather.
      Saturday starts brightly across most of the country,
      though there'll be a band of rain pushing in from the west
      by mid-afternoon. Temperatures around fifteen, which is
      about average for the time of year.
      Sunday is the better of the two days — dry, plenty of sunshine,
      and feeling warmer, up to nineteen in the south east.
      If you're planning anything outdoors, Sunday's your day.
    questions:
      - key: gist
        type: gist
        prompt: "What is the main message of the forecast?"
        options:
          - "Sunday will be better than Saturday."
          - "The whole weekend will be wet."
          - "Saturday will be warmer than Sunday."
          - "A storm is expected on Sunday."
        answer: "Sunday will be better than Saturday."
      - key: detail
        type: detail
        prompt: "When is the rain expected on Saturday?"
        options: ["Mid-afternoon", "Early morning", "Late evening", "Around lunchtime"]
        answer: "Mid-afternoon"
      - key: inference
        type: inference
        prompt: "What does the presenter suggest?"
        options:
          - "Plan outdoor activities for Sunday."
          - "Stay indoors all weekend."
          - "Travel to the south east on Saturday."
          - "Expect unusually cold weather."
        answer: "Plan outdoor activities for Sunday."

  # --- B2 -----------------------------------------------------------------
  - key: listen.b2.panel_disagreement
    level: B2
    skill: listening.complex_argument
    title: "A disagreement about remote work"
    setting: "Two speakers on a discussion programme, Ana and Mark."
    minutes: 9
    speech_rate: 1.05
    transcript: |
      ANA: The productivity data is pretty clear, though.
      Output per head went up, and it stayed up.
      MARK: Went up on measurable tasks. That's not the same thing.
      What you can't see in that data is the stuff that used to
      happen by accident — someone overhearing how a problem
      got solved, a junior picking up judgement they were never
      formally taught.
      ANA: I'm not disputing that's harder now. I'd just rather
      solve it deliberately than go back to hoping proximity
      does it for us. Mandating attendance doesn't recreate
      those moments; it just puts people in the same postcode.
      MARK: Maybe. Although I'd say we haven't really tried
      to design the alternative either.
    questions:
      - key: gist
        type: gist
        prompt: "What do Ana and Mark disagree about?"
        options:
          - "Whether productivity data captures what matters."
          - "Whether output per head actually rose."
          - "Whether juniors should be paid more."
          - "Whether the programme should continue."
        answer: "Whether productivity data captures what matters."
      - key: detail
        type: detail
        prompt: "What does Mark say the data cannot show?"
        options:
          - "Informal learning that used to happen by chance."
          - "The total hours people work."
          - "How many staff have resigned."
          - "The cost of office space."
        answer: "Informal learning that used to happen by chance."
      - key: inference
        type: inference
        prompt: "How would you describe Mark's final remark?"
        options:
          - "A partial concession that still holds his ground."
          - "A complete change of mind."
          - "A refusal to discuss it further."
          - "An accusation that Ana is wrong."
        answer: "A partial concession that still holds his ground."

  # --- C1 -----------------------------------------------------------------
  - key: listen.c1.lecture_aside
    level: C1
    skill: listening.implicit_extended
    title: "A lecturer going off-script"
    setting: "A university lecture on urban planning, part-way through."
    minutes: 10
    speech_rate: 1.1
    transcript: |
      ...so the standard account is that the ring road relieved congestion
      in the centre. And on the numbers, for about six years, it did.
      What the standard account leaves out -- and I say this having sat on
      the review panel, so take it for what it is worth -- is that the
      traffic did not disappear. It relocated. The eastern suburbs absorbed
      it, and nobody was measuring the eastern suburbs, because the eastern
      suburbs were not in the terms of reference.
      Now, I am not suggesting anyone falsified anything. I am suggesting
      that if you only count where you are looking, you will always find
      that you have solved the problem.
    questions:
      - key: gist
        type: gist
        prompt: "What is the lecturer's main point?"
        options:
          - "The measured success came from not measuring the whole system."
          - "The ring road failed to reduce congestion at all."
          - "The review panel deliberately falsified its figures."
          - "Urban planning is impossible to evaluate."
        answer: "The measured success came from not measuring the whole system."
      - key: detail
        type: detail
        prompt: "Why were the eastern suburbs not counted?"
        options:
          - "They were outside the review's terms of reference."
          - "No traffic reached them."
          - "The data was lost."
          - "Residents refused to take part."
        answer: "They were outside the review's terms of reference."
      - key: inference
        type: inference
        prompt: "Why does the lecturer mention sitting on the review panel?"
        options:
          - "To flag their own possible bias while claiming inside knowledge."
          - "To establish that the panel was incompetent."
          - "To distance themselves from the findings entirely."
          - "To claim credit for the ring road's success."
        answer: "To flag their own possible bias while claiming inside knowledge."
      - key: inference2
        type: inference
        prompt: "'I am not suggesting anyone falsified anything' functions as"
        options:
          - "A disclaimer that sharpens the criticism that follows."
          - "A full retraction of the previous point."
          - "A defence of the review panel's methods."
          - "An admission that the lecturer was wrong."
        answer: "A disclaimer that sharpens the criticism that follows."

  # --- C2 -----------------------------------------------------------------
  - key: listen.c2.negotiation
    level: C2
    skill: listening.near_unrestricted
    title: "Two people not quite saying no"
    setting: "A phone call between a supplier, Ines, and a client, Rob."
    minutes: 11
    speech_rate: 1.15
    transcript: |
      ROB: So we were hoping to have the whole thing wrapped by the end of
      the quarter. Is that -- I mean, is that the sort of timeline you would
      recognise?
      INES: It is a timeline. Whether I would recognise it as ours is a
      different question. What is driving the quarter, specifically?
      ROB: Board reporting, mostly. It would be helpful.
      INES: Helpful to whom, though? Because if it is helpful to the board
      and expensive for your team, I have seen how that ends, and it ends
      with us being blamed for the quality.
      ROB: That is -- yes. All right. What would you need for it not to
      end that way?
      INES: Either the scope moves or the date does. I do not mind which.
      I mind very much being asked to hold both.
    questions:
      - key: gist
        type: gist
        prompt: "What is Ines doing in this call?"
        options:
          - "Refusing the deadline without ever saying no."
          - "Agreeing to the end-of-quarter timeline."
          - "Blaming Rob's team for previous quality problems."
          - "Withdrawing from the project entirely."
        answer: "Refusing the deadline without ever saying no."
      - key: detail
        type: detail
        prompt: "What does Ines say she needs?"
        options:
          - "Either the scope or the date to move."
          - "Both the scope and the date fixed."
          - "A different point of contact."
          - "Payment in advance."
        answer: "Either the scope or the date to move."
      - key: inference
        type: inference
        prompt: "'It is a timeline' implies"
        options:
          - "That it is not a timeline she has agreed to."
          - "That she considers it reasonable."
          - "That she has not understood the question."
          - "That the project has no timeline yet."
        answer: "That it is not a timeline she has agreed to."
      - key: inference2
        type: inference
        prompt: "Rob's 'That is -- yes. All right.' signals that he"
        options:
          - "Concedes the point mid-sentence and changes tack."
          - "Has stopped listening."
          - "Disagrees but is being polite."
          - "Is confirming the original deadline."
        answer: "Concedes the point mid-sentence and changes tack."


  # =========================================================================
  # Expansion, 2026-07-28.
  #
  # Seven clips, one at most levels, so a learner's second listening session
  # at their band was a replay of something they had already understood.
  # These add a second at every level.
  #
  # Speech rate falls as the level rises, but not to normal: even at C2 it
  # stays a shade under 1.0. Browser synthesis at full speed drops the weak
  # forms and elisions that make real speech hard, so a clip that *sounds*
  # native-paced would still be measuring something easier than listening.
  # The honest position is that these are synthesised, the evidence records
  # `synthesised: true`, and the rate is set for intelligibility rather than
  # realism.
  #
  # Each transcript is written to be heard rather than read: false starts,
  # self-correction, and information given in the order a speaker would give
  # it rather than the order a reader would want it.
  # =========================================================================

  - key: listen.a1.answerphone
    level: A1
    skill: listening.basic_personal
    title: "A message about a delivery"
    setting: "A recorded message left on your phone by a delivery company."
    minutes: 4
    speech_rate: 0.8
    transcript: |
      Hello, this is a message about your parcel.
      We came to your address today at eleven o'clock,
      but nobody was at home.
      The parcel is now at the post office on King Street.
      You can collect it from Tuesday. Please bring some identification.
      Thank you.
    questions:
      - key: gist
        type: gist
        prompt: "Why is the company calling?"
        options:
          - "They could not deliver a parcel."
          - "The parcel is lost."
          - "They want to change the address."
          - "The parcel has been sent back."
        answer: "They could not deliver a parcel."
      - key: detail
        type: detail
        prompt: "Where is the parcel now?"
        options:
          - "At the post office on King Street."
          - "At the delivery company."
          - "With a neighbour."
          - "Still on the van."
        answer: "At the post office on King Street."
      - key: inference
        type: inference
        prompt: "What do you need to take with you?"
        options:
          - "Something that shows who you are."
          - "The money for the parcel."
          - "The delivery van's number."
          - "Nothing at all."
        answer: "Something that shows who you are."

  - key: listen.a2.rearranged_class
    level: A2
    skill: listening.routine_messages
    title: "A class has moved"
    setting: "A voice message from a language school to a student."
    minutes: 5
    speech_rate: 0.85
    transcript: |
      Hi, it's Farah from the school. Sorry, quick change -
      your Wednesday class is moving to Thursday, same time,
      seven o'clock. It's just for next week, then it goes back
      to Wednesday. Oh, and it's in room twelve, not room five,
      because they're painting the corridor. Sorry about that.
      See you Thursday.
    questions:
      - key: gist
        type: gist
        prompt: "What is the message about?"
        options:
          - "A change to the day and the room of one class."
          - "A class that has been cancelled."
          - "A new teacher for the class."
          - "A change to the time of the class."
        answer: "A change to the day and the room of one class."
      - key: detail
        type: detail
        prompt: "How long does the change last?"
        options:
          - "One week only."
          - "The rest of the term."
          - "Two weeks."
          - "She does not say."
        answer: "One week only."
      - key: inference
        type: inference
        prompt: "Why has the room changed?"
        options:
          - "Work is being done in the corridor."
          - "Room five is too small."
          - "Another class is using room five."
          - "Room twelve is closer to the entrance."
        answer: "Work is being done in the corridor."

  - key: listen.b2.two_accounts
    level: B2
    skill: listening.complex_argument
    title: "Two people remember the same meeting"
    setting: "Two colleagues talking after a meeting they both attended."
    minutes: 8
    speech_rate: 0.9
    transcript: |
      - So that went well, I thought. We got a decision.
      - Did we? I'm not sure we did, actually. I mean, nobody
        objected, but that's not the same thing.
      - Sam said he was happy with it.
      - Sam said he "didn't have a problem with it", which is -
        look, I've worked with him for six years. That's what he
        says when he thinks something is a mistake and he doesn't
        want to be the one arguing about it.
      - That seems like a lot to read into one sentence.
      - Maybe. But he didn't ask a single question, and Sam always
        asks questions when he's actually on board. That's the bit
        that worries me.
    questions:
      - key: gist
        type: gist
        prompt: "What are the two speakers disagreeing about?"
        options:
          - "Whether the meeting really reached agreement."
          - "Whether Sam should have been invited."
          - "What the decision actually was."
          - "Who is responsible for the next step."
        answer: "Whether the meeting really reached agreement."
      - key: detail
        type: detail
        prompt: "What does the second speaker say Sam did not do?"
        options:
          - "Ask any questions."
          - "Attend the whole meeting."
          - "Say anything at all."
          - "Read the proposal."
        answer: "Ask any questions."
      - key: inference
        type: inference
        prompt: "Why does the second speaker quote Sam's exact words?"
        options:
          - "Because the wording was deliberately non-committal."
          - "Because Sam had misunderstood the proposal."
          - "Because Sam spoke too quietly to be sure."
          - "Because Sam had said the opposite earlier."
        answer: "Because the wording was deliberately non-committal."

  - key: listen.c1.the_correction
    level: C1
    skill: listening.implicit_extended
    title: "A correction that is not quite an apology"
    setting: "An extract from a radio interview with a company spokesperson."
    minutes: 9
    speech_rate: 0.95
    transcript: |
      - You told this programme in March that no jobs would be
        affected. Two hundred people have since lost their jobs.
      - What I said in March reflected the information available
        at that time, and I stand by the process we followed.
      - That isn't quite what I asked. Was the statement wrong?
      - I think it's important to recognise that circumstances
        changed considerably over the summer, and -
      - Was it wrong?
      - With hindsight, it's clear the position was more finely
        balanced than the language we used suggested. And I'd
        accept that people who heard that statement may have
        drawn a firmer conclusion than was warranted.
    questions:
      - key: gist
        type: gist
        prompt: "What is happening in this exchange?"
        options:
          - "The interviewer presses for an admission the spokesperson avoids making directly."
          - "The spokesperson apologises for misleading listeners."
          - "The two disagree about how many jobs were lost."
          - "The interviewer accepts the spokesperson's explanation."
        answer: "The interviewer presses for an admission the spokesperson avoids making directly."
      - key: detail
        type: detail
        prompt: "What does the spokesperson say they stand by?"
        options:
          - "The process that was followed."
          - "The exact wording used in March."
          - "The decision to cut the jobs."
          - "The figure of two hundred."
        answer: "The process that was followed."
      - key: inference
        type: inference
        prompt: >
          The spokesperson says listeners "may have drawn a firmer conclusion
          than was warranted". Where does this place the responsibility?
        options:
          - "On the listeners, while appearing to concede the point."
          - "On the company, clearly and without qualification."
          - "On the interviewer for misquoting the statement."
          - "On circumstances that changed later."
        answer: "On the listeners, while appearing to concede the point."

  - key: listen.c2.the_seminar_question
    level: C2
    skill: listening.near_unrestricted
    title: "A question that is really an objection"
    setting: "The question period after an academic talk."
    minutes: 10
    speech_rate: 0.95
    transcript: |
      - Thank you, that was fascinating. I wonder if I could ask
        a very small technical question, really more of a
        clarification. You describe the second cohort as
        comparable to the first. Comparable in what respect?
      - In respect of age and region, principally.
      - Ah. Not in respect of how they were recruited.
      - No, the recruitment differed, as I said in the paper.
      - You did, you did. I only raise it because the effect you
        report is, if I've followed correctly, roughly the size
        one would expect from that difference alone. Which is
        not to say it explains the finding. Only that I couldn't
        quite see, from the paper, how one would tell.
    questions:
      - key: gist
        type: gist
        prompt: "What is the questioner actually doing?"
        options:
          - "Raising a fundamental objection in the form of a small clarification."
          - "Asking for a definition they did not understand."
          - "Praising the design of the study."
          - "Suggesting a larger sample next time."
        answer: "Raising a fundamental objection in the form of a small clarification."
      - key: detail
        type: detail
        prompt: "In what respects were the two cohorts comparable?"
        options:
          - "Age and region."
          - "Age and recruitment."
          - "Region and size."
          - "Every respect that mattered."
        answer: "Age and region."
      - key: inference
        type: inference
        prompt: >
          Why does the questioner add "which is not to say it explains the
          finding"?
        options:
          - "To keep the objection unanswerable by making no claim of their own."
          - "To withdraw the objection politely."
          - "To agree that the finding is sound."
          - "To admit they had not read the paper carefully."
        answer: "To keep the objection unanswerable by making no claim of their own."
