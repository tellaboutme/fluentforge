version: 0.1.0
description: >
  Focused study units: one point explained, then practice on exactly that
  point. The explanation stays visible while the learner practises, so this is
  scaffolded work by design — the evidence it produces is recorded at reduced
  independence (docs/ASSESSMENT_ENGINE.md).

  Every practice item names the linguistic feature it exercises, so a wrong
  answer becomes a specific practisable error rather than "something in this
  skill" (apps/api/app/learning/taxonomy.py).

  All content is original to this repository. Grading is deterministic:
  multiple choice against a known answer, or a typed form matched against an
  explicit list of accepted spellings. The study lab works with AI disabled.

units:
  # --- A1 -----------------------------------------------------------------
  - key: study.a1.be_and_word_order
    level: A1
    skill: grammar.basic_clause
    title: "Saying who and what: the verb 'be'"
    minutes: 6
    explanation: |
      English needs a verb in almost every sentence, even when you are only
      saying what something is. That verb is usually 'be': am, is, or are.

      The order is subject, then verb, then the rest: "My sister is a nurse."
      English does not drop the verb the way many languages do, and it does
      not usually move the subject after the verb in a statement.

      To make it negative, add 'not' after the verb: "I am not ready."
      To ask, put the verb first: "Are you ready?"
    examples:
      - "I am from Lisbon."
      - "The shops are closed on Sunday."
      - "She is not at home today."
      - "Are they your neighbours?"
    items:
      - key: i1
        type: choice
        feature: grammar.agreement.subject_verb
        prompt: "My brothers ___ at university in Berlin."
        options: ["are", "is", "am", "be"]
        answer: "are"
        note: >
          'Brothers' is plural, so the verb is 'are'. 'Is' goes with one
          person or thing.
      - key: i2
        type: choice
        feature: grammar.word_order.question
        prompt: "___ your parents at home this evening?"
        options: ["Are", "Is", "Do", "They are"]
        answer: "Are"
        note: >
          To ask a question with 'be', the verb comes first: "Are your
          parents...?" You do not need 'do' with 'be'.
      - key: i3
        type: gap_fill
        feature: grammar.negation.form
        prompt: "I ___ (not / be) hungry, thank you."
        answer: "am not"
        accept: ["'m not", "am not"]
        note: >
          'Not' goes after 'be': "I am not hungry." The short form is
          "I'm not".
      - key: i4
        type: choice
        feature: grammar.word_order.statement
        prompt: "___ very cold today."
        options: ["It is", "Is", "Is it", "Very cold is"]
        answer: "It is"
        note: >
          English sentences need a subject, even when there is nothing real to
          point at. For weather and time we use 'it'.

  # --- A2 -----------------------------------------------------------------
  - key: study.a2.past_simple
    level: A2
    skill: grammar.past_future_basic
    title: "Talking about finished time"
    minutes: 8
    explanation: |
      Use the past simple for something that is finished, at a time that is
      finished: yesterday, last week, in 2019, an hour ago.

      Most verbs add -ed: worked, arrived, stopped. Many common verbs are
      irregular and simply have to be learned: go went, see saw, take took,
      buy bought, come came.

      For negatives and questions, use 'did' plus the plain form of the verb.
      The past is already marked on 'did', so the main verb goes back to
      normal: "I did not go", not "I did not went".
    examples:
      - "We arrived at eight and left before lunch."
      - "She bought the tickets last Friday."
      - "I did not see your message until this morning."
      - "Did you speak to the landlord?"
    items:
      - key: i1
        type: gap_fill
        feature: grammar.tense.past_simple_form
        prompt: "Yesterday she ___ (go) to the office by bus."
        answer: "went"
        note: >
          'Go' is irregular: the past simple is 'went'. There is no -ed form.
      - key: i2
        type: gap_fill
        feature: grammar.tense.past_simple_form
        prompt: "We ___ (not / see) the email until this morning."
        answer: "did not see"
        accept: ["didn't see", "did not see"]
        note: >
          After 'did not', the verb goes back to its plain form: 'see', not
          'saw'. 'Did' already carries the past.
      - key: i3
        type: choice
        feature: grammar.word_order.question
        prompt: "___ you finish the report on Friday?"
        options: ["Did", "Do", "Have", "Were"]
        answer: "Did"
        note: >
          'On Friday' is a finished time, so the question uses 'did' plus the
          plain verb 'finish'.
      - key: i4
        type: choice
        feature: grammar.preposition.time_place
        prompt: "They moved to Manchester ___ 2019."
        options: ["in", "on", "at", "since"]
        answer: "in"
        note: >
          Years take 'in'. Days take 'on' (on Monday), clock times take 'at'
          (at six).
      - key: i5
        type: gap_fill
        feature: grammar.tense.past_simple_form
        prompt: "He ___ (take) the wrong train and arrived an hour late."
        answer: "took"
        note: >
          'Take' is irregular: took. Notice 'arrived' is regular and just adds
          -ed.

  - key: study.a2.everyday_collocations
    level: A2
    skill: vocabulary.everyday_topics
    title: "Words that go together"
    minutes: 7
    explanation: |
      Some English words belong together and others do not, even when the
      meaning would be clear either way. These pairs are called collocations,
      and you learn them as whole chunks rather than word by word.

      'Make' and 'do' cause the most trouble. Roughly: you 'make' something
      that did not exist before (make a plan, make a mistake, make dinner),
      and you 'do' work or an activity (do your homework, do the washing, do
      business).

      Learning the chunk is faster than learning the rule, and the rule has
      too many exceptions to trust on its own.
    examples:
      - "Can I make a suggestion?"
      - "I need to do the washing before Friday."
      - "She made a mistake in the total."
      - "We do business with them every year."
    items:
      - key: i1
        type: choice
        feature: lexis.collocation.verb_noun
        prompt: "I think I ___ a mistake on the form."
        options: ["made", "did", "took", "had"]
        answer: "made"
        note: >
          It is always 'make a mistake'. 'Do a mistake' is understandable but
          not English.
      - key: i2
        type: choice
        feature: lexis.collocation.verb_noun
        prompt: "He never ___ his homework before the last evening."
        options: ["does", "makes", "takes", "gives"]
        answer: "does"
        note: >
          Homework is work you carry out, so it is 'do your homework'.
      - key: i3
        type: gap_fill
        feature: lexis.collocation.verb_noun
        prompt: "Could I ___ a photo of the noticeboard?"
        answer: "take"
        note: >
          Photos are 'taken', not made or done. This is a fixed chunk worth
          memorising whole.
      - key: i4
        type: choice
        feature: lexis.confusable.pair
        prompt: "Could you ___ me twenty euros until Friday?"
        options: ["lend", "borrow", "loan me to", "rent"]
        answer: "lend"
        note: >
          You lend something to someone; you borrow something from someone.
          The lender gives, the borrower takes.

  # --- B1 -----------------------------------------------------------------
  - key: study.b1.present_perfect
    level: B1
    skill: grammar.connected_time_modality
    title: "Present perfect, or past simple?"
    minutes: 9
    explanation: |
      Both forms describe the past. The difference is whether the time is
      finished.

      Use the past simple when the time is over and usually stated: yesterday,
      last month, in March, when I was a student. "I saw her on Tuesday."

      Use the present perfect when the past matters *now* — the time is not
      finished, or you are not saying when. "I have seen that film" means you
      have the experience; when is not the point. "I have lived here for three
      years" means you still live here.

      This is why 'yesterday' and the present perfect do not go together. Once
      you name a finished time, use the past simple.

      'For' measures a length of time; 'since' names a starting point.
    examples:
      - "I have worked here since March."
      - "I worked there for two years, then I left."
      - "Have you ever been to Poland?"
      - "She went to Poland last spring."
    items:
      - key: i1
        type: choice
        feature: grammar.tense.perfect_vs_past
        prompt: "I ___ my keys — I cannot get in."
        options: ["have lost", "lost", "was losing", "had lost"]
        answer: "have lost"
        note: >
          The loss matters right now: you still cannot get in. That present
          consequence is what the present perfect is for.
      - key: i2
        type: choice
        feature: grammar.tense.perfect_vs_past
        prompt: "We ___ the contract last Thursday."
        options: ["signed", "have signed", "have been signing", "sign"]
        answer: "signed"
        note: >
          'Last Thursday' is a finished time, so the past simple is required.
          The present perfect cannot take a stated finished time.
      - key: i3
        type: choice
        feature: grammar.preposition.time_place
        prompt: "She has been the manager ___ 2021."
        options: ["since", "for", "from", "during"]
        answer: "since"
        note: >
          'Since' names the point it started; 'for' measures the length —
          "for three years".
      - key: i4
        type: gap_fill
        feature: grammar.tense.perfect_vs_past
        prompt: "I ___ (never / work) nights in my life."
        answer: "have never worked"
        accept: ["have never worked", "'ve never worked"]
        note: >
          'In my life' is unfinished time, so the present perfect fits.
          'Never' sits between 'have' and the participle.
      - key: i5
        type: choice
        feature: grammar.tense.perfect_vs_past
        prompt: "I ___ in Madrid for six years, but I moved away in 2020."
        options: ["lived", "have lived", "have been living", "live"]
        answer: "lived"
        note: >
          You no longer live there, so the period is finished: past simple.
          "I have lived in Madrid for six years" would mean you still do.

  - key: study.b1.linking_ideas
    level: B1
    skill: vocabulary.independent_range
    title: "Joining ideas so the reader can follow"
    minutes: 8
    explanation: |
      At B1 the sentences are usually right and the *joins* are what let a
      reader down. A connective tells the reader what relationship is coming,
      so the wrong one is worse than none at all.

      Contrast: but, however, although, though. 'Although' starts a clause
      ("Although it rained, we went"); 'however' starts a new sentence
      ("It rained. However, we went").

      Reason and result: because, since, so, therefore, as a result. 'Because'
      introduces the cause; 'so' introduces the result. They point in opposite
      directions.

      Addition: and, also, in addition, moreover.
    examples:
      - "Although the flat is small, it gets a lot of light."
      - "The line was closed, so we walked."
      - "We walked because the line was closed."
      - "The price is fair. However, delivery takes a month."
    items:
      - key: i1
        type: choice
        feature: discourse.cohesion.connective
        prompt: "The flat is small. ___, it gets plenty of light."
        options: ["However", "Although", "Because", "So"]
        answer: "However"
        note: >
          'However' joins two separate sentences. 'Although' would need one
          sentence: "Although the flat is small, it gets plenty of light."
      - key: i2
        type: choice
        feature: discourse.cohesion.connective
        prompt: "The train was cancelled, ___ we took a taxi."
        options: ["so", "because", "although", "however"]
        answer: "so"
        note: >
          The taxi is the result of the cancellation. 'Because' would reverse
          the logic: it introduces the cause.
      - key: i3
        type: gap_fill
        feature: discourse.cohesion.connective
        prompt: "___ I had read the instructions twice, I still assembled it wrongly."
        answer: "although"
        accept: ["although", "though", "even though"]
        note: >
          The two facts clash, and one sentence holds both, so a subordinator
          of contrast fits: although, though, or even though.
      - key: i4
        type: choice
        feature: grammar.clause.subordination
        prompt: "___ the deadline moved, we still had too little time."
        options: ["Even though", "Even", "Despite", "However"]
        answer: "Even though"
        note: >
          'Despite' is followed by a noun ("despite the delay"), not by a
          clause with a subject and a verb.

  # --- B2 -----------------------------------------------------------------
  - key: study.b2.conditionals_and_hedging
    level: B2
    skill: grammar.broad_control
    title: "Conditionals, and saying how sure you are"
    minutes: 10
    explanation: |
      A conditional pairs a situation with its consequence, and the tenses on
      the two halves have to agree with each other.

      Real and likely: "If the figures arrive today, we will publish on
      Friday." Present in the 'if' clause, 'will' in the result. Note that
      'will' does not appear in the 'if' clause itself.

      Unlikely or imaginary now: "If we had more time, we would test it
      properly." Past form in the 'if' clause, 'would' in the result — even
      though you are talking about the present.

      Finished and impossible: "If we had tested it, we would not have
      shipped the bug." Past perfect, then 'would have'.

      Modals also let you say how sure you are, which at B2 matters as much as
      accuracy: 'must' for near certainty, 'might' or 'could' for possibility,
      'cannot' for near impossibility.
    examples:
      - "If the figures arrive today, we will publish on Friday."
      - "If we had more time, we would test it properly."
      - "If we had tested it, we would not have shipped the bug."
      - "That must be the courier. It cannot be the post at this hour."
    items:
      - key: i1
        type: choice
        feature: grammar.conditional.form
        prompt: "If the supplier ___ tomorrow, we can still meet the deadline."
        options: ["confirms", "will confirm", "confirmed", "would confirm"]
        answer: "confirms"
        note: >
          'Will' does not appear inside the 'if' clause. The present form
          carries the future meaning there.
      - key: i2
        type: gap_fill
        feature: grammar.conditional.form
        prompt: "If I ___ (know) the answer, I would have said so at the time."
        answer: "had known"
        accept: ["had known", "'d known"]
        note: >
          The result is 'would have said' — finished and impossible — so the
          'if' clause takes the past perfect: had known.
      - key: i3
        type: choice
        feature: grammar.modality.obligation
        prompt: "She left an hour ago, so she ___ be home by now."
        options: ["must", "can", "should have", "might not"]
        answer: "must"
        note: >
          'Must' expresses a confident deduction from evidence, not
          obligation, in this use.
      - key: i4
        type: choice
        feature: grammar.conditional.form
        prompt: "If we ___ the venue now, we would lose the deposit."
        options: ["changed", "change", "had changed", "would change"]
        answer: "changed"
        note: >
          'Would lose' signals a hypothetical present, so the 'if' clause
          takes the past form: "If we changed the venue now..."
      - key: i5
        type: choice
        feature: grammar.passive.form
        prompt: "The report ___ before the board meets on Tuesday."
        options:
          - "must be finished"
          - "must finish"
          - "must have finished"
          - "must be finishing"
        answer: "must be finished"
        note: >
          The report does not finish anything; something is done to it. After
          a modal the passive is 'be' plus the past participle.

  - key: study.b2.precision_and_collocation
    level: B2
    skill: vocabulary.precision_collocation
    title: "Choosing the word a competent user would choose"
    minutes: 9
    explanation: |
      At B2 the problem is rarely being understood. It is being approximate:
      picking a word close enough to work but not the one a proficient user
      would reach for.

      Two habits fix most of it. First, learn strong verb-noun pairs as units:
      'raise a concern', 'meet a deadline', 'draw a conclusion', 'reach an
      agreement', 'take responsibility'. Second, watch word families — the
      right root in the wrong part of speech is a very visible B2 error:
      'a success outcome' should be 'a successful outcome'.

      Also watch pairs that look interchangeable and are not: 'affect' is
      normally the verb and 'effect' the noun; 'economic' means to do with the
      economy while 'economical' means cheap to run.
    examples:
      - "I would like to raise a concern about the timeline."
      - "We reached an agreement after two hours."
      - "The delay affected everyone. Its effect is still visible."
      - "The change had a successful outcome."
    items:
      - key: i1
        type: choice
        feature: lexis.collocation.verb_noun
        prompt: "I would like to ___ a concern about the timeline."
        options: ["raise", "say", "tell", "speak"]
        answer: "raise"
        note: >
          'Raise a concern' is the standard pairing. 'Say a concern' is
          understandable but marks the writer as approximate.
      - key: i2
        type: gap_fill
        feature: lexis.word_form.derivation
        prompt: "The pilot produced a ___ (success) outcome in every region."
        answer: "successful"
        note: >
          'Outcome' is a noun, so it needs the adjective 'successful'.
          'Success' is itself a noun.
      - key: i3
        type: choice
        feature: lexis.confusable.pair
        prompt: "The delay ___ every team in the building."
        options: ["affected", "effected", "affect", "effect"]
        answer: "affected"
        note: >
          'Affect' is the verb; 'effect' is normally the noun — "the effect of
          the delay".
      - key: i4
        type: choice
        feature: lexis.collocation.verb_noun
        prompt: "After two hours we finally ___ an agreement."
        options: ["reached", "arrived", "did", "found"]
        answer: "reached"
        note: >
          'Reach an agreement' is the fixed pairing. You arrive *at* a
          decision, but you reach an agreement.
      - key: i5
        type: choice
        feature: lexis.precision.approximation
        prompt: "The new heating system is far more ___ than the old one."
        options: ["economical", "economic", "economy", "economics"]
        answer: "economical"
        note: >
          'Economical' means cheap to run. 'Economic' means relating to the
          economy — an economic policy, an economical car.

  - key: study.b2.register
    level: B2
    skill: pragmatics.register_choice
    title: "Matching the tone to the reader"
    minutes: 8
    explanation: |
      Register is the difference between writing that is correct and writing
      that fits. The same request can be too blunt for a stranger and
      absurdly stiff for a colleague you see daily.

      Three things carry most of it. Distance: 'Send me the file' versus
      'Could you send me the file when you get a moment?' Contractions and
      phrasal verbs feel informal; their single-word equivalents feel formal —
      'put off' against 'postpone', 'find out' against 'establish'.
      Directness: a formal complaint softens the accusation rather than
      sharpening it.

      There is no rule that formal is better. Over-formality with a close
      colleague reads as cold or sarcastic.
    examples:
      - "Could you send the file over when you get a chance?"
      - "I am writing to request a copy of the report."
      - "We had to put the meeting off."
      - "The meeting has been postponed until further notice."
    items:
      - key: i1
        type: choice
        feature: pragmatics.register.formality
        prompt: "In a formal complaint: 'The meeting was ___ without notice.'"
        options: ["postponed", "put off", "pushed back", "moved about"]
        answer: "postponed"
        note: >
          Single-word Latinate verbs read as formal; the phrasal equivalents
          read as conversational.
      - key: i2
        type: choice
        feature: pragmatics.politeness.directness
        prompt: "Writing to someone you have never met: '___ send me the figures?'"
        options: ["Could you possibly", "Send me", "You must", "I want you to"]
        answer: "Could you possibly"
        note: >
          A request to a stranger needs softening. A bare imperative reads as
          an order, whatever you intended.
      - key: i3
        type: choice
        feature: pragmatics.register.formality
        prompt: "In a message to a close colleague: 'I ___ get to it before Friday.'"
        options: ["won't", "shall not", "am not going to be able to", "regret to say I cannot"]
        answer: "won't"
        note: >
          With someone you know well, the contracted form fits. The formal
          alternatives would read as cold or sarcastic.
      - key: i4
        type: gap_fill
        feature: pragmatics.politeness.directness
        prompt: "Softening a disagreement: 'I ___ not be so sure about that.'"
        answer: "would"
        accept: ["would", "'d"]
        note: >
          'I would not be so sure' disagrees without contradicting the person
          directly. 'You are wrong' closes the conversation.

  # --- C1 -----------------------------------------------------------------
  - key: study.c1.information_flow
    level: C1
    skill: grammar.flexible_complexity
    title: "Putting the news at the end"
    minutes: 10
    explanation: |
      At C1 accuracy is assumed; what distinguishes writing is control of
      information flow. English sentences tend to move from known to new: the
      start of a sentence anchors it in what the reader already has, and the
      end carries the news. Grammar gives you tools to arrange that.

      Fronting moves an element forward for contrast: "This point, nobody
      disputes." Clefts pick one element out and make everything else
      background: "It was the cost that killed the project" answers a
      different question than "The cost killed the project."

      The passive is often taught as a formality marker, but its real use is
      flow: "The proposal was rejected by the board" keeps 'the proposal' as
      the anchor when the previous sentence was about the proposal.

      None of these forms is better in isolation. Each is an answer to the
      question: what does the reader hold right now, and what am I adding?
    examples:
      - "It was the cost, not the schedule, that killed the project."
      - "What worries me most is the maintenance burden."
      - "The proposal was rejected -- and rejected unanimously."
      - "This much, at least, nobody disputes."
    items:
      - key: i1
        type: choice
        feature: grammar.word_order.statement
        prompt: "The previous sentence was about the report. Best continuation: ___"
        options:
          - "The report was praised by both reviewers."
          - "Both reviewers praised the report."
          - "There was praise for the report from both reviewers."
          - "Praising the report were both reviewers."
        answer: "The report was praised by both reviewers."
        note: >
          Known-to-new: the reader is holding 'the report', so it anchors the
          sentence and the news -- the praise -- lands at the end. This is the
          passive doing its real job.
      - key: i2
        type: gap_fill
        feature: grammar.clause.subordination
        prompt: "___ was the delay that annoyed them, not the cost. (cleft with 'it')"
        answer: "it"
        note: >
          The it-cleft "It was X that..." picks one element out as the answer
          to an implied question and backgrounds the rest.
      - key: i3
        type: choice
        feature: grammar.word_order.statement
        prompt: "To emphasise the object: '___'"
        options:
          - "This argument I find unconvincing."
          - "I find this argument unconvincing."
          - "Unconvincing is what I find this argument."
          - "I this argument find unconvincing."
        answer: "This argument I find unconvincing."
        note: >
          Fronting the object marks contrast: this argument, as opposed to the
          others. The neutral order states; the fronted order positions.
      - key: i4
        type: choice
        feature: grammar.clause.relative
        prompt: "Most natural: 'The committee raised two objections, ___ was answered.'"
        options:
          - "neither of which"
          - "which neither"
          - "that neither"
          - "neither that"
        answer: "neither of which"
        note: >
          Quantifier + 'of which' carries a whole clause of information in
          four words -- a C1 pattern for dense, controlled sentences.

  - key: study.c1.hedging_and_stance
    level: C1
    skill: pragmatics.nuance
    title: "Saying how far you will go"
    minutes: 9
    explanation: |
      Advanced English marks *stance*: how confident you are, how much you
      are conceding, and how much room you leave the other person. Getting
      this wrong does not make you hard to understand -- it makes you sound
      more certain, more dismissive, or more committed than you meant to be.

      Hedges soften a claim without withdrawing it: "arguably", "to some
      extent", "it would seem". Boosters do the opposite: "clearly",
      "undoubtedly". A concession clause gives ground on purpose: "While the
      data is thin, the trend is consistent" -- and the main clause is where
      you actually stand.

      The order matters. Concede first, then assert: putting the concession
      after the claim reads as backing down rather than as balance.
    examples:
      - "While the sample is small, the effect is consistent."
      - "This is, arguably, the weakest part of the proposal."
      - "It would seem that the figures were never checked."
      - "That may be so. The deadline, however, has not moved."
    items:
      - key: i1
        type: choice
        feature: discourse.cohesion.connective
        prompt: "Concede then assert: '___ the sample is small, the trend is consistent.'"
        options: ["While", "Because", "Unless", "So that"]
        answer: "While"
        note: >
          'While' opens a concession: you grant the weakness and then stand
          your ground in the main clause.
      - key: i2
        type: gap_fill
        feature: grammar.modality.obligation
        prompt: "Distancing yourself from a claim: 'It ___ seem that the figures were never checked.'"
        answer: "would"
        accept: ["would", "'d"]
        note: >
          'It would seem' reports an impression while declining to fully own
          it -- the writer leaves room to be wrong.
      - key: i3
        type: choice
        feature: pragmatics.politeness.directness
        prompt: "Firm but not aggressive: 'That may be so. The deadline, ___, has not moved.'"
        options: ["however", "therefore", "moreover", "instead"]
        answer: "however"
        note: >
          Granting the point first ('that may be so') costs nothing and buys
          the contrast that follows its full force.
      - key: i4
        type: choice
        feature: lexis.precision.approximation
        prompt: "Softening without withdrawing: 'This is ___ the weakest part of the proposal.'"
        options: ["arguably", "definitely", "completely", "absolutely"]
        answer: "arguably"
        note: >
          'Arguably' claims the position while conceding that someone could
          argue back. The other options close that door.

  # --- C2 -----------------------------------------------------------------
  - key: study.c2.register_shifting
    level: C2
    skill: vocabulary.fine_shades
    title: "The same fact, four temperatures"
    minutes: 10
    explanation: |
      At C2 the question is no longer whether a word is correct but what it
      does to the room. English keeps near-synonyms at different temperatures
      -- Anglo-Saxon words run warm and direct, Latinate words run cool and
      institutional -- and shifting between them is a stylistic instrument.

      "The plan died" and "the initiative was discontinued" report the same
      fact. The first belongs in an honest retrospective, the second in a
      shareholder letter, and swapping them changes the writer, not the fact.

      Fine shades also separate words that dictionaries call synonyms:
      'childish' condemns what 'childlike' admires; 'economical with the
      truth' is an accusation wearing a suit. A C2 writer chooses these on
      purpose, and hears when someone else has.
    examples:
      - "The plan died. / The initiative was discontinued."
      - "Her childlike curiosity -- not childish, childlike."
      - "He was, let us say, economical with the truth."
      - "We let people go. We do not 'right-size the organisation'."
    items:
      - key: i1
        type: choice
        feature: lexis.confusable.pair
        prompt: "Admiring her openness and wonder: 'her ___ curiosity'"
        options: ["childlike", "childish", "infantile", "juvenile"]
        answer: "childlike"
        note: >
          'Childlike' keeps the good qualities of childhood; the other three
          are all, in different registers, insults.
      - key: i2
        type: choice
        feature: pragmatics.register.formality
        prompt: "In a candid internal retrospective: 'The plan ___.'"
        options: ["died", "was discontinued", "underwent termination", "was sunsetted"]
        answer: "died"
        note: >
          Candour calls for the warm, direct register. The Latinate options
          are for documents that want distance from the fact.
      - key: i3
        type: choice
        feature: lexis.precision.approximation
        prompt: "An accusation phrased with deniability: 'He was ___ with the truth.'"
        options: ["economical", "generous", "careless", "flexible"]
        answer: "economical"
        note: >
          'Economical with the truth' is a fixed ironic phrase: it accuses
          someone of lying while formally saying only that they said little.
      - key: i4
        type: gap_fill
        feature: lexis.word_form.derivation
        prompt: "Cooling the register: 'we fired him' becomes 'his employment was ___ (terminate).'"
        answer: "terminated"
        note: >
          Nominalisation and the passive together remove the actor and the
          heat. Knowing how to do this -- and when not to -- is one skill.

  - key: study.c2.irony_and_understatement
    level: C2
    skill: pragmatics.mastery
    title: "Meaning more by saying less"
    minutes: 9
    explanation: |
      English, especially British English, does heavy work with
      understatement. "Not ideal" can mean catastrophic; "quite good" can be
      faint praise or real praise depending on stress; "with respect" often
      opens an attack. A C2 user reads these correctly and deploys them
      knowing they will be read.

      The mechanism is a gap between the scale of the words and the scale of
      the facts, which the listener is trusted to notice. That trust is the
      point: understatement is a compliment to the audience.

      The risk is real: used on someone who takes words at face value, "not
      ideal" simply misinforms. Register judgement includes knowing when
      plain speech is the only honest option.
    examples:
      - "The server room flooded. This is not ideal."
      - "With respect, that is not what the contract says."
      - "I have one or two concerns. (Meaning: a great many.)"
      - "That went about as well as expected. (Meaning: badly.)"
    items:
      - key: i1
        type: choice
        feature: lexis.precision.approximation
        prompt: "The building burned down. A colleague says the situation is '___'. Understatement:"
        options: ["not ideal", "catastrophic", "unprecedented", "actionable"]
        answer: "not ideal"
        note: >
          The gap between 'not ideal' and a burned-down building is the
          message. The listener is trusted to measure it.
      - key: i2
        type: choice
        feature: pragmatics.politeness.directness
        prompt: "'___, that is not what the contract says' -- softening a direct challenge:"
        options: ["With respect", "Obviously", "As everyone knows", "Wrong --"]
        answer: "With respect"
        note: >
          'With respect' concedes status while withdrawing agreement. It is
          famously the polite form of a sharp disagreement.
      - key: i3
        type: choice
        feature: discourse.reference.given_new
        prompt: "'I have one or two concerns' about a disastrous draft most likely signals ___"
        options:
          - "Many serious concerns, stated with irony."
          - "Exactly one or two minor concerns."
          - "No concerns worth discussing."
          - "That the speaker has not read it."
        answer: "Many serious concerns, stated with irony."
        note: >
          The formula 'one or two' plus a visibly bad referent flips the
          literal count. Reading that flip is a C2 listening skill as much as
          a speaking one.
      - key: i4
        type: choice
        feature: pragmatics.register.formality
        prompt: "When understatement would misinform -- a safety briefing -- the right register is ___"
        options:
          - "Plain and literal."
          - "Ironic but gentle."
          - "Formal and nominalised."
          - "Warm and idiomatic."
        answer: "Plain and literal."
        note: >
          Judgement includes knowing when the instrument must stay in the
          case. Safety-critical speech takes no trust-me gaps.

  - key: study.a1.countability_and_articles
    level: A1
    skill: vocabulary.high_frequency_survival
    title: "One apple, some rice: counting and not counting"
    minutes: 8
    explanation: |
      English divides nouns into things you can count and things you cannot.
      You can have one apple, two apples. You cannot have "two rices" --
      rice is treated as a substance, not as separate items.

      This decides three things at once. Countable nouns take a/an in the
      singular and add -s in the plural. Uncountable nouns take no a/an and
      no -s. And each group takes different quantity words: many apples but
      much rice, a few apples but a little rice.

      Use 'a' the first time you mention something, and 'the' once the
      listener knows which one you mean: "I bought a book. The book was
      expensive."

      Some nouns are uncountable in English and countable in other
      languages -- information, advice, furniture, news, money. These are
      worth learning as a short list rather than working out each time.
    examples:
      - "I bought a book. The book was expensive."
      - "There is some rice in the cupboard."
      - "She gave me some very good advice."
      - "How much money do you need? How many euros?"
    items:
      - key: i1
        type: choice
        feature: grammar.article.definite_indefinite
        prompt: "I have ___ apple in my bag."
        options: ["an", "a", "the", "some"]
        answer: "an"
        note: >
          'Apple' starts with a vowel sound, so it takes 'an'. It is also the
          first mention, which is why 'a/an' and not 'the'.
      - key: i2
        type: choice
        feature: grammar.noun.countability
        prompt: "She gave me some very useful ___."
        options: ["advice", "advices", "an advice", "advice's"]
        answer: "advice"
        note: >
          'Advice' is uncountable in English: no plural -s and no a/an. For
          one piece, say 'a piece of advice'.
      - key: i3
        type: choice
        feature: grammar.quantifier.choice
        prompt: "How ___ money do we need for the tickets?"
        options: ["much", "many", "few", "several"]
        answer: "much"
        note: >
          'Much' goes with uncountable nouns like money; 'many' goes with
          countable ones like euros or tickets.
      - key: i4
        type: gap_fill
        feature: grammar.article.definite_indefinite
        prompt: "I bought a book yesterday. ___ book was more expensive than I expected."
        answer: "the"
        note: >
          Second mention: the listener now knows which book, so it moves from
          'a' to 'the'.
      - key: i5
        type: choice
        feature: grammar.noun.countability
        prompt: "There ___ too much furniture in this room."
        options: ["is", "are", "were", "have"]
        answer: "is"
        note: >
          'Furniture' is uncountable, so it takes a singular verb however
          many chairs are involved.

  - key: study.a2.present_and_future
    level: A2
    skill: grammar.past_future_basic
    title: "Now, usually, and later"
    minutes: 9
    explanation: |
      Three choices that learners often collapse into one.

      The present simple is for habits and permanent states: "I work in
      Madrid", "the shop opens at nine". Remember the -s after he, she, it.

      The present continuous is for what is happening now, or around now,
      and for arrangements already fixed: "I am working from home today",
      "I am meeting Ana on Friday".

      Verbs of state -- know, like, want, believe, own -- normally stay
      simple even when you mean right now. "I am knowing the answer" is not
      English.

      For the future, English has several forms doing different jobs.
      'Will' for a decision made as you speak or a prediction; 'going to'
      for an intention you already had; the present continuous for a fixed
      arrangement.
    examples:
      - "She works in Madrid. She is working from home today."
      - "I am meeting Ana at six -- it is already arranged."
      - "That bag looks heavy. I will carry it for you."
      - "We are going to repaint the kitchen this summer."
    items:
      - key: i1
        type: gap_fill
        feature: grammar.tense.present_simple_form
        prompt: "My brother ___ (work) in a hospital in Vienna."
        answer: "works"
        note: >
          Third person singular in the present simple adds -s. This is the
          single most common slip at A2.
      - key: i2
        type: choice
        feature: grammar.tense.progressive_vs_simple
        prompt: "Be quiet -- the baby ___."
        options: ["is sleeping", "sleeps", "sleep", "has slept"]
        answer: "is sleeping"
        note: >
          Happening right now, so the continuous. 'The baby sleeps a lot'
          would be a habit, which is a different claim.
      - key: i3
        type: choice
        feature: grammar.tense.progressive_vs_simple
        prompt: "I ___ what you mean, but I disagree."
        options: ["understand", "am understanding", "understands", "was understanding"]
        answer: "understand"
        note: >
          'Understand' is a state verb: it stays simple even when you mean at
          this moment.
      - key: i4
        type: choice
        feature: grammar.tense.future_reference
        prompt: "That box looks heavy. Do not worry -- I ___ help you."
        options: ["will", "am going to", "am", "would"]
        answer: "will"
        note: >
          The decision is being made as you speak, which is what 'will' is
          for. 'Going to' would imply you had already planned it.
      - key: i5
        type: choice
        feature: grammar.tense.future_reference
        prompt: "I can't come on Friday -- I ___ my sister at the airport."
        options: ["am meeting", "will meet", "meet", "would meet"]
        answer: "am meeting"
        note: >
          A fixed arrangement, already made, takes the present continuous.

  - key: study.b1.verb_patterns_and_reference
    level: B1
    skill: grammar.connected_time_modality
    title: "What follows a verb, and what a pronoun points at"
    minutes: 10
    explanation: |
      Two things that keep sentences from tangling.

      First, each verb chooses what can follow it, and the choice has to be
      learned with the verb. Some take an infinitive: decide to go, manage
      to finish, refuse to answer. Some take an -ing form: enjoy reading,
      avoid speaking, suggest going. A few take either, with a change of
      meaning: "I stopped smoking" and "I stopped to smoke" describe
      opposite events.

      Second, a pronoun has to point at exactly one thing the reader has
      already been given. "I told Ana about Maria, and she was upset" leaves
      the reader guessing which one. If the antecedent is not obvious,
      repeat the name -- clarity beats elegance.

      When you report what someone said, the tense usually shifts back:
      "I am tired" becomes "she said she was tired".
    examples:
      - "She managed to finish before the deadline."
      - "He avoided answering the question."
      - "I stopped smoking. / I stopped to smoke."
      - "She said she was tired, so we went home."
    items:
      - key: i1
        type: choice
        feature: grammar.verb_pattern.complementation
        prompt: "She managed ___ the report before the deadline."
        options: ["to finish", "finishing", "finish", "for finishing"]
        answer: "to finish"
        note: >
          'Manage' takes an infinitive. Patterns like this are learned with
          the verb; there is no rule that predicts them.
      - key: i2
        type: choice
        feature: grammar.verb_pattern.complementation
        prompt: "He avoided ___ the question directly."
        options: ["answering", "to answer", "answer", "answered"]
        answer: "answering"
        note: >
          'Avoid' takes the -ing form. Compare 'refuse to answer', which
          takes the infinitive.
      - key: i3
        type: choice
        feature: grammar.pronoun.reference
        prompt: "Clearest version: 'I told Ana about Maria, and ___ was upset.'"
        options: ["Ana", "she", "her", "they"]
        answer: "Ana"
        note: >
          Two women have been mentioned, so 'she' points at either. Repeating
          the name is not clumsy here; it is the only unambiguous choice.
      - key: i4
        type: gap_fill
        feature: grammar.tense.sequence_backshift
        prompt: "'I am tired,' she said. -> She said she ___ tired."
        answer: "was"
        note: >
          Reporting shifts the tense back one step: am becomes was.
      - key: i5
        type: choice
        feature: grammar.comparison.form
        prompt: "This route is ___ than the motorway, but it is prettier."
        options: ["slower", "more slow", "slowest", "more slower"]
        answer: "slower"
        note: >
          Short adjectives take -er. 'More slower' doubles the comparative,
          which is a common and very visible error.

  - key: study.b2.sentence_boundaries_and_paragraphs
    level: B2
    skill: writing.clear_detailed_argument
    title: "Where sentences and paragraphs end"
    minutes: 9
    explanation: |
      Two mechanical faults that make otherwise good writing hard to read.

      A comma splice joins two complete sentences with a comma: "The train
      was late, we missed the meeting." Both halves could stand alone, so a
      comma is not enough. Use a full stop, a semicolon, or a joining word:
      "The train was late, so we missed the meeting."

      A paragraph holds one idea. It opens with a sentence that says what
      the paragraph is about, develops it, and stops before the next idea
      starts. A page-long block signals to the reader that you did not
      decide where one thought ended -- and they will have to do that work
      instead.

      Neither of these is about being formal. They are about the reader
      knowing where they are.
    examples:
      - "The train was late. We missed the meeting."
      - "The train was late, so we missed the meeting."
      - "The train was late; we missed the meeting."
      - "Each paragraph does one job. This one is about paragraphs."
    items:
      - key: i1
        type: choice
        feature: mechanics.punctuation.sentence_boundary
        prompt: "Correctly punctuated: '___'"
        options:
          - "The train was late, so we missed the meeting."
          - "The train was late, we missed the meeting."
          - "The train was late we missed the meeting."
          - "The train was late, however we missed the meeting."
        answer: "The train was late, so we missed the meeting."
        note: >
          A comma alone cannot join two complete sentences. 'So' is a joining
          word, which makes the comma correct.
      - key: i2
        type: choice
        feature: mechanics.punctuation.sentence_boundary
        prompt: "Fixing a comma splice without a joining word: 'It rained all day ___ the match was cancelled.'"
        options: [";", ",", "and,", "--,"]
        answer: ";"
        note: >
          A semicolon joins two complete, closely related sentences. A full
          stop would also be correct.
      - key: i3
        type: choice
        feature: discourse.organisation.paragraphing
        prompt: "A new paragraph should start when ___"
        options:
          - "the topic changes."
          - "the paragraph reaches five lines."
          - "you have used a connective."
          - "you introduce a quotation."
        answer: "the topic changes."
        note: >
          Length is a symptom, not the rule. One paragraph, one idea.
      - key: i4
        type: choice
        feature: mechanics.spelling.common
        prompt: "Correctly spelled: 'The change had a noticeable ___ on morale.'"
        options: ["effect", "affect", "efect", "affekt"]
        answer: "effect"
        note: >
          'Effect' is the noun here. 'Affect' is normally the verb: the
          change affected morale, and the effect was visible.

  - key: study.b1.phrasal_verbs
    level: B1
    skill: vocabulary.independent_range
    title: "Phrasal verbs: the particle carries the meaning"
    minutes: 9
    explanation: |
      A phrasal verb is a verb plus a particle, and the pair means something
      the parts do not. 'Look' means look; 'look after' means care for;
      'look into' means investigate; 'look up' means find in a reference.
      The verb is doing very little work -- the particle is carrying it.

      This is why guessing from the verb fails. It also means you cannot
      swap particles and stay understood: "look after this word in the
      dictionary" will simply confuse.

      Two practical points. Many phrasal verbs have a single-word equivalent
      that sounds more formal: put off / postpone, find out / establish,
      bring up / raise. And some separate around their object -- "turn the
      light off" -- while others never do: "look after the children", never
      "look the children after".

      Learn them in a phrase, not as a list of particles.
    examples:
      - "Could you look after the cat while we are away?"
      - "I will look into it and come back to you."
      - "Let me look up the exact figure."
      - "They put the meeting off until Thursday."
    items:
      - key: i1
        type: gap_fill
        feature: lexis.phrasal_verb.meaning
        prompt: "I do not know the word -- I will look it ___ in the dictionary."
        answer: "up"
        note: >
          'Look up' means find in a reference. 'Look into' would mean
          investigate, which is a different action.
      - key: i2
        type: choice
        feature: lexis.phrasal_verb.meaning
        prompt: "Could you ___ the children on Saturday?"
        options: ["look after", "look up", "look into", "look over"]
        answer: "look after"
        note: >
          'Look after' is care for. The particle is doing all the work here;
          the verb 'look' contributes almost nothing.
      - key: i3
        type: choice
        feature: lexis.phrasal_verb.meaning
        prompt: "The meeting was ___ until Thursday."
        options: ["put off", "put up", "put out", "put in"]
        answer: "put off"
        note: >
          'Put off' is postpone. The single-word equivalent is the more
          formal choice, which is a register decision, not a correctness one.
      - key: i4
        type: choice
        feature: lexis.phrasal_verb.meaning
        prompt: "Which of these is NOT possible English? ___"
        options:
          - "look the children after"
          - "turn the light off"
          - "turn off the light"
          - "look after the children"
        answer: "look the children after"
        note: >
          'Look after' never separates around its object. 'Turn off' does,
          which is why the other two orders are both fine.


  # --- C-level: the features the mediation lab named -----------------------
  #
  # The taxonomy gained five features with the mediation lab, and a feature
  # with no unit behind it is a category the error log can name and the plan
  # can never answer. These five close that gap.
  #
  # They are also the point of `docs/ROADMAP.md` Milestone 7: what separates
  # B2 from C2 is not harder words but what a learner can do with stance,
  # attribution, implication and order. None of that is a vocabulary quiz.

  - key: study.b2.hedging
    level: B2
    skill: pragmatics.register_choice
    title: "Saying how sure you are"
    minutes: 10
    explanation: |
      English marks certainty, and readers hear the marking whether or not
      you meant it. "The scheme failed" and "the scheme appears to have
      failed" are not the same claim, and neither is more polite than the
      other -- they report different amounts of evidence.

      Three ways to mark it. Modal verbs: may, might, could, would. Verbs of
      appearing and suggesting: seems, appears, suggests, indicates.
      Adverbs and quantifiers: possibly, largely, in some cases, around.

      Two failures, and the second is the one nobody warns you about.

      Under-hedging states a tentative finding flatly. If the evidence is one
      small study, "keeping a journal improves sleep" claims more than you
      have, and a reader who checks will not trust the rest.

      Over-hedging stacks the markers until nothing is claimed at all: "it
      may possibly be the case that there could perhaps be some slight
      indication". One hedge is a measurement. Four is an evasion, and it
      reads as though you are hiding something.

      Aim for one marker doing one job, and drop it entirely when the
      evidence is solid. Hedging everything is as inaccurate as hedging
      nothing.
    examples:
      - "The figures suggest a decline, though the sample was small."
      - "Attendance fell by around six per cent."
      - "This may explain the gap, but the survey did not ask."
      - "The building was closed on eleven days in January."
    items:
      - key: i1
        type: choice
        feature: pragmatics.stance.hedging
        prompt: >
          One study of 148 people found an association. The accurate
          report of it is ___
        options:
          - "The results suggest a link, though the study was small."
          - "Writing a journal improves sleep."
          - "It is now known that journals cure insomnia."
          - "Journals have been proven to help everyone sleep."
        answer: "The results suggest a link, though the study was small."
        note: >
          'Suggest' plus the stated limitation matches what one small study
          can support. The other three claim more evidence than exists.
      - key: i2
        type: choice
        feature: pragmatics.stance.hedging
        prompt: "The sentence that hedges so much it claims nothing is ___"
        options:
          - "It may possibly be that there could perhaps be some effect."
          - "The effect may be small."
          - "There appears to be an effect."
          - "The effect was small."
        answer: "It may possibly be that there could perhaps be some effect."
        note: >
          Four markers doing one job. Stacked hedges do not make a claim
          safer -- they make it unreadable, and readers assume you are
          hiding something.
      - key: i3
        type: gap_fill
        feature: pragmatics.stance.hedging
        prompt: >
          The bookings were counted exactly: 9,412. Total bookings ___ 9,412.
        answer: "were"
        note: >
          A counted figure needs no hedge. 'Appear to have been' would
          under-claim evidence you actually have, which is its own kind of
          inaccuracy.
      - key: i4
        type: choice
        feature: pragmatics.stance.hedging
        prompt: >
          Residents said use had fallen; the council denied it. The best
          report of that is ___
        options:
          - "Residents report a fall, which the council disputes."
          - "Use of the centre has fallen sharply."
          - "The council is lying about the figures."
          - "Nothing at all has changed at the centre."
        answer: "Residents report a fall, which the council disputes."
        note: >
          The disagreement is the fact. Choosing a side and stating it flatly
          reports something neither source established.

  - key: study.b2.attribution
    level: B2
    skill: pragmatics.register_choice
    title: "Saying whose claim it is"
    minutes: 9
    explanation: |
      When you report what a source said, the reader has to be able to tell
      where the source stops and you begin. Lose that line and you have
      quietly adopted somebody else's claim as your own.

      The markers are small and they do all the work: according to, X says
      that, X reports, in X's account, X argues. Note the difference between
      'reports' and 'argues' -- one presents a fact, the other a position, and
      choosing the wrong one misdescribes the source.

      Watch what happens across two sentences. "According to the council, the
      building is open. Residents found it locked." The first is attributed,
      the second is yours -- and you have just endorsed the residents without
      saying so. If both are claims, both need marking.

      The reverse failure is attributing your own reasoning to a source: "the
      report says the two figures cannot both be right" when the report says
      no such thing and you worked it out. That is your inference and it is a
      good one; take credit for it and let the reader judge it.
    examples:
      - "According to the council, the building remains open."
      - "The report gives 9,412 bookings; the newspaper gives a much larger fall."
      - "The two figures cannot both be right, though neither source says so."
      - "The authors argue that the result is suggestive rather than settled."
    items:
      - key: i1
        type: choice
        feature: pragmatics.attribution.source
        prompt: >
          The council said the centre was open. You have no view. The
          sentence reporting it without adopting it is ___
        options:
          - "According to the council, the centre remained open."
          - "The centre remained open."
          - "The centre was obviously open the whole time."
          - "The council is right that the centre was open."
        answer: "According to the council, the centre remained open."
        note: >
          The marker keeps the claim with its source. Dropping it makes the
          council's claim yours, which is not what you meant to write.
      - key: i2
        type: choice
        feature: pragmatics.attribution.source
        prompt: >
          You noticed the two figures conflict. Neither source mentions it.
          The honest sentence is ___
        options:
          - "The two figures cannot both be right, though neither source says so."
          - "The report says the two figures cannot both be right."
          - "Both sources agree the figures conflict."
          - "As the newspaper points out, the figures conflict."
        answer: "The two figures cannot both be right, though neither source says so."
        note: >
          It is your inference. Attributing it to a source hides who is
          reasoning, and a reader who checks the source will stop trusting
          you.
      - key: i3
        type: choice
        feature: pragmatics.attribution.source
        prompt: "The verb presenting a position rather than a fact is ___"
        options: ["argues", "reports", "records", "states the figure"]
        answer: "argues"
        note: >
          'Argues' signals a case being made. Using it for a plain figure
          makes a source sound partisan; using 'reports' for a contested
          claim makes it sound settled.
      - key: i4
        type: choice
        feature: pragmatics.attribution.source
        prompt: >
          "According to the council, the building is open. Residents found
          it locked." What has gone wrong is ___
        options:
          - "The second claim is unattributed, so it reads as the writer's own."
          - "Nothing; both claims are clearly marked."
          - "The first claim needs no marker."
          - "The two sentences should be joined with 'but'."
        answer: "The second claim is unattributed, so it reads as the writer's own."
        note: >
          Attributing one side and not the other takes a side silently. If
          both are claims, both need marking.

  # Sentence-level flow already has a unit (`study.c1.information_flow`,
  # above). This one is about the *document*: which order the reader needs
  # the material in, which is the failure a synthesis actually makes.
  - key: study.c1.ordering_a_synthesis
    level: C1
    skill: writing.well_structured_complex
    title: "Ordering a synthesis for a reader"
    minutes: 10
    explanation: |
      There are two orders available to you, and they are rarely the same.
      The order you found things in, and the order a reader needs them.
      Writing in the first is the commonest reason a well-informed account is
      hard to follow.

      The tell is a document organised by source: everything from the first
      source, then everything from the second, then everything from the
      third. Each paragraph is fine. The reader still cannot see what is at
      issue, because nothing has been put beside anything.

      Organise by issue instead. What question does the reader have to
      settle? Group what bears on it, from wherever it came. Three sources on
      one question is one paragraph; one source touching three questions is
      split across three.

      Within a sentence the same principle runs smaller: known information
      first, new information last. "The lease costs £61,000. That figure is
      the second largest line after salaries" flows; reversing the two makes
      the reader hold a fact they cannot yet place.

      A synthesis that reads as one summary after another has not synthesised
      anything.
    examples:
      - "Two questions face the board: cost, and what the office is for."
      - "On cost, the finance note and the survey point in opposite directions."
      - "The lease costs £61,000. That is the second largest line after salaries."
      - "Both the editorial team and the survey mention time, but mean different things by it."
    items:
      - key: i1
        type: choice
        feature: discourse.organisation.information_flow
        prompt: >
          You are synthesising three views for a board. The structure that
          is a synthesis is ___
        options:
          - "One section per question at issue, drawing on whichever sources bear on it."
          - "One section per person, summarising each in turn."
          - "The sources in the order you read them."
          - "The longest source first, then the others."
        answer: "One section per question at issue, drawing on whichever sources bear on it."
        note: >
          Organising by source produces three summaries in a row. Nothing has
          been placed beside anything, so nothing has been synthesised.
      - key: i2
        type: choice
        feature: discourse.organisation.information_flow
        prompt: "The pair of sentences that flows better for a reader is ___"
        options:
          - "The lease costs £61,000. That is the second largest line after salaries."
          - "The second largest line after salaries is £61,000. The lease costs that."
          - "£61,000 the lease costs. Salaries are the largest line."
          - "Salaries. The lease. £61,000 a year."
        answer: "The lease costs £61,000. That is the second largest line after salaries."
        note: >
          Known first, new last. The reverse makes the reader hold a figure
          before they know what it refers to.
      - key: i3
        type: choice
        feature: discourse.organisation.information_flow
        prompt: >
          A briefing opens: "The newspaper says X. The report says Y."
          What is missing is ___
        options:
          - "What is at issue between them, which is why the reader is reading."
          - "The date each source was published."
          - "A longer quotation from each."
          - "The writer's own opinion, stated first."
        answer: "What is at issue between them, which is why the reader is reading."
        note: >
          Two summaries placed next to each other leave the reader to do the
          comparison. Doing it for them is the job.
      - key: i4
        type: choice
        feature: discourse.organisation.information_flow
        prompt: >
          One source touches three separate questions. In an issue-ordered
          account it goes ___
        options:
          - "Split across all three, wherever each point bears on the question."
          - "All in one place, so the source stays intact."
          - "First, because it covers the most ground."
          - "Last, as a summary of the others."
        answer: "Split across all three, wherever each point bears on the question."
        note: >
          Keeping a source intact is organising by source again. The reader
          needs the material grouped by their question, not by its origin.

  - key: study.c1.irony
    level: C1
    skill: pragmatics.nuance
    title: "Irony and understatement"
    minutes: 9
    explanation: |
      Sometimes the words say one thing and the speaker means another, and
      everyone in the room knows it except the person taking it literally.
      Missing this is a comprehension failure, not a vocabulary gap: every
      word was understood.

      What signals it is the gap between what is said and what is obviously
      true. "Well, that went well" after a disaster. "It is a little damp"
      standing in a downpour. Nothing in the words carries the meaning -- the
      mismatch does, and so does intonation in speech and context in writing.

      British English leans heavily on understatement, and it is not
      politeness. "I have one or two reservations" can mean a proposal is
      unworkable. "That is quite interesting" can mean the opposite. Reading
      those literally will leave you agreeing to things nobody agreed to.

      Producing irony in a second language is risky and rarely necessary.
      Recognising it is not optional: it changes what was decided in the
      meeting you were in.

      The reliable test is not the words. Ask whether the speaker could
      plausibly mean what they said, given what everyone present can see.
    examples:
      - "'Another delay. Marvellous.' -- said after the third delay."
      - "'I have one or two small reservations about the whole plan.'"
      - "'It is a bit chilly' -- in a snowstorm."
      - "'That is one way of doing it.'"
    items:
      - key: i1
        type: choice
        feature: pragmatics.rhetoric.irony
        prompt: >
          The third delay is announced. A colleague says: "Marvellous."
          What they mean is ___
        options:
          - "They are frustrated; the word says the opposite of what they mean."
          - "They are pleased about the delay."
          - "They think the announcement was well made."
          - "They did not hear the announcement."
        answer: "They are frustrated; the word says the opposite of what they mean."
        note: >
          Nothing in 'marvellous' carries this. The gap between the word and
          what everyone can see does.
      - key: i2
        type: choice
        feature: pragmatics.rhetoric.irony
        prompt: >
          A manager says: "I have one or two reservations about the plan."
          The likeliest meaning is ___
        options:
          - "Serious objections, put mildly."
          - "Exactly two small points of detail."
          - "Full agreement with the plan."
          - "They have not read the plan."
        answer: "Serious objections, put mildly."
        note: >
          Understatement, not politeness. Taken literally you would go ahead;
          taken as meant you would stop.
      - key: i3
        type: choice
        feature: pragmatics.rhetoric.irony
        prompt: "What most reliably signals that a remark is ironic is ___"
        options:
          - "The mismatch between what was said and what everyone can see."
          - "A particular set of ironic words."
          - "The speaker smiling."
          - "The sentence being short."
        answer: "The mismatch between what was said and what everyone can see."
        note: >
          There is no ironic vocabulary. Context does the work, which is why
          a dictionary cannot help you here.
      - key: i4
        type: choice
        feature: pragmatics.rhetoric.irony
        prompt: >
          Your proposal is met with: "That is one way of doing it." You
          should read it ___
        options:
          - "As a doubt about the approach, not an endorsement of it."
          - "As agreement that your way is correct."
          - "As a request for a second option."
          - "As a compliment on your originality."
        answer: "As a doubt about the approach, not an endorsement of it."
        note: >
          Literally it says nothing at all, which is the signal. If the
          speaker agreed, they would have said so.

  - key: study.c1.figurative
    level: C1
    skill: vocabulary.broad_idiomatic
    title: "Idiom and metaphor: when not to take it apart"
    minutes: 9
    explanation: |
      Some expressions cannot be understood from their parts, and taking them
      apart is what goes wrong. 'Break the ice' has nothing to do with ice.
      'Move the goalposts' is about changing the rules after people started
      playing.

      Two things follow.

      They are fixed. 'Break the ice' works; 'crack the ice' and 'break the
      frost' do not, though nothing about the meaning explains why. Learn the
      whole phrase or leave it alone -- a half-remembered idiom is more
      confusing than the plain words would have been.

      They carry register. Idioms are usually informal, which makes them the
      wrong choice in a formal report and exactly right in an email to a
      colleague. Using one in a legal summary reads as a misjudgement of the
      situation, not as a mistake of meaning.

      Dead metaphors are different and safe: 'the leg of the table', 'the
      heart of the matter'. Nobody notices these. Live metaphors that mix --
      'a watershed moment that opened the floodgates' -- draw attention to
      themselves and rarely survive the attention.

      Recognising idiom matters far more than producing it. You will meet a
      great many more than you will ever need to use.
    examples:
      - "Someone had to break the ice, so I asked about the journey."
      - "They moved the goalposts halfway through the process."
      - "That is the heart of the matter."
      - "The proposal was, in the report's phrase, not fit for purpose."
    items:
      - key: i1
        type: choice
        feature: lexis.idiom.figurative
        prompt: "'They moved the goalposts' means ___"
        options:
          - "They changed the requirements after work had started."
          - "They relocated some equipment."
          - "They scored unexpectedly."
          - "They cancelled the match."
        answer: "They changed the requirements after work had started."
        note: >
          Nothing in 'goalposts' gives you this. The phrase means what it
          means as a whole, and taking it apart is what leads you astray.
      - key: i2
        type: choice
        feature: lexis.idiom.figurative
        prompt: "The fixed form is ___"
        options: ["break the ice", "crack the ice", "break the frost", "split the ice"]
        answer: "break the ice"
        note: >
          The others are all reasonable by meaning and all wrong. Idioms are
          learned whole, not assembled.
      - key: i3
        type: choice
        feature: lexis.idiom.figurative
        prompt: >
          You are writing a formal report for a regulator. The better
          choice is ___
        options:
          - "The requirements changed after work began."
          - "They moved the goalposts on us."
          - "It was a whole new ball game."
          - "They pulled the rug out from under us."
        answer: "The requirements changed after work began."
        note: >
          The idiom is not wrong in meaning; it is wrong in register, which
          in a regulatory document reads as misjudging the situation.
      - key: i4
        type: choice
        feature: lexis.idiom.figurative
        prompt: "The one a reader will actually notice as a metaphor is ___"
        options:
          - "A watershed moment that opened the floodgates."
          - "The heart of the matter."
          - "The leg of the table."
          - "The head of the department."
        answer: "A watershed moment that opened the floodgates."
        note: >
          The other three are dead metaphors nobody registers. Two live ones
          in a row draw attention and rarely survive it.

  # =========================================================================
  # Expansion, 2026-07-28. A1 and C2 held two units each against six at B2 —
  # the two bands with the least material being the two where a learner is
  # most likely to be stuck: the beginner who cannot yet read around a gap,
  # and the advanced learner whose remaining errors are the subtle ones.
  # =========================================================================

  - key: study.a1.questions
    level: A1
    skill: grammar.basic_clause
    title: "Asking a question: the word order changes"
    minutes: 8
    explanation: |
      In a statement, the subject comes first: "You are ready." In a
      question, the verb 'be' moves in front of it: "Are you ready?"

      With other verbs, English uses 'do' or 'does' to carry the question,
      and the main verb goes back to its plain form:

      She works here. -> Does she work here?  (not "Does she works")
      They live nearby. -> Do they live nearby?

      Question words come first, before all of that: "Where do they live?"

      The commonest mistake is keeping statement order and only changing the
      voice: "You are ready?" will usually be understood, but "Where you
      live?" often will not, because the listener is waiting for the verb.
    examples:
      - "Are you a student?"
      - "Does he work on Fridays?"
      - "Where do they live?"
      - "What time does the shop open?"
    items:
      - key: i1
        type: choice
        feature: grammar.word_order.question
        prompt: "___ you a student?"
        options: ["Are", "You are", "Do", "Is"]
        answer: "Are"
        note: >
          With 'be', the verb moves in front of the subject. No 'do' is
          needed, because 'be' can ask the question by itself.
      - key: i2
        type: choice
        feature: grammar.word_order.question
        prompt: "___ he work on Fridays?"
        options: ["Does", "Do", "Is", "Has"]
        answer: "Does"
        note: >
          He/she/it takes 'does'. The main verb then stays plain: 'work',
          not 'works'.
      - key: i3
        type: gap_fill
        feature: grammar.word_order.question
        prompt: "Where ___ they live?"
        answer: "do"
        note: >
          The question word comes first, then 'do', then the subject. This
          is the order learners most often lose.
      - key: i4
        type: choice
        feature: grammar.word_order.question
        prompt: "Which one is correct English? ___"
        options:
          - "What time does the shop open?"
          - "What time the shop opens?"
          - "What time does the shop opens?"
          - "What time opens the shop?"
        answer: "What time does the shop open?"
        note: >
          'Does' carries the question, so 'open' stays plain. Leaving 'does'
          out entirely is the version listeners find hardest.

  - key: study.a1.past_of_be
    level: A1
    skill: grammar.basic_clause
    title: "Was and were: talking about before"
    minutes: 8
    explanation: |
      'Be' has two past forms and they follow the subject:

      I / he / she / it -> was
      you / we / they   -> were

      Negatives add 'not': "I was not there", "They were not open".
      In speech these usually shorten: wasn't, weren't.

      This is worth learning properly at A1 because 'be' appears in almost
      every sentence about a past situation - where you were, how something
      was, who was with you. A learner who reaches for 'were' after 'he'
      will make the same slip hundreds of times before anyone corrects it.
    examples:
      - "I was at home yesterday."
      - "The shop was closed."
      - "They were very kind."
      - "We weren't late."
    items:
      - key: i1
        type: gap_fill
        feature: grammar.agreement.subject_verb
        prompt: "Yesterday I ___ at home all day."
        answer: "was"
        note: "'I' takes 'was'."
      - key: i2
        type: gap_fill
        feature: grammar.agreement.subject_verb
        prompt: "They ___ very kind to us."
        answer: "were"
        note: "'They' takes 'were', like 'you' and 'we'."
      - key: i3
        type: choice
        feature: grammar.agreement.subject_verb
        prompt: "The shop ___ closed when we arrived."
        options: ["was", "were", "is", "are"]
        answer: "was"
        note: >
          'The shop' is one thing, so it takes 'was'. 'Is' would move the
          sentence into the present, which contradicts 'arrived'.
      - key: i4
        type: choice
        feature: grammar.negation.form
        prompt: "We ___ late, we were early."
        options: ["weren't", "wasn't", "not were", "didn't"]
        answer: "weren't"
        note: >
          'We' takes 'were', so the negative is 'weren't'. 'Didn't' is for
          other verbs, not for 'be'.

  - key: study.a1.this_that
    level: A1
    skill: vocabulary.high_frequency_survival
    title: "This, that, these, those"
    minutes: 7
    explanation: |
      Two things decide the word: how near, and how many.

      near + one   -> this      near + more than one   -> these
      far  + one   -> that      far  + more than one   -> those

      "This bag is mine." (in your hand)
      "That bag is mine." (over there)
      "These shoes are new." / "Those shoes are new."

      They also work without a noun: "What is this?", "How much are those?"

      Learners often use 'this' for everything, which is understood but
      leaves the listener unsure which object is meant - and pointing does
      not survive a phone call.
    examples:
      - "This is my bag."
      - "How much are those?"
      - "These shoes are new."
      - "That is not mine."
    items:
      - key: i1
        type: choice
        feature: grammar.noun.countability
        prompt: "(holding one book) ___ book is very good."
        options: ["This", "These", "Those", "That"]
        answer: "This"
        note: "One book, and it is near you."
      - key: i2
        type: choice
        feature: grammar.noun.countability
        prompt: "(pointing across the room) ___ shoes are expensive."
        options: ["Those", "These", "This", "That"]
        answer: "Those"
        note: "More than one, and far away."
      - key: i3
        type: gap_fill
        feature: grammar.pronoun.reference
        prompt: "What is ___? (about something in your hand)"
        answer: "this"
        note: >
          These words work on their own, with no noun after them, when it is
          obvious what you mean.
      - key: i4
        type: choice
        feature: grammar.noun.countability
        prompt: "Which sentence is correct? ___"
        options:
          - "These apples are cheap."
          - "This apples are cheap."
          - "Those apple is cheap."
          - "That apples are cheap."
        answer: "These apples are cheap."
        note: >
          Plural noun takes a plural word. Mixing them is the commonest slip
          here.

  - key: study.c2.nominalisation
    level: C2
    skill: grammar.stylistic_control
    title: "Turning actions into things, and what it hides"
    minutes: 11
    explanation: |
      English lets you turn a verb into a noun: decide -> decision, reassess
      -> reassessment, fail -> failure. The effect on a sentence is larger
      than it looks.

      "We reassessed the timetable" names an agent. "There has been a
      reassessment of the timetable" does not: the action survives and the
      actor disappears. Nothing false has been said, and there is now nobody
      to ask.

      This is a genuine tool. It compresses: "the reassessment" can carry a
      whole clause you have already stated, so the sentence can move on to
      what matters. It also raises register, which is why it is everywhere
      in formal writing.

      And it is the standard way of removing responsibility from a sentence
      without lying in it. "Mistakes were made" is the passive doing this;
      "there was a failure of oversight" is nominalisation doing it more
      thoroughly, because now even the verb has gone.

      At C2 the skill is not avoiding it. It is noticing when it is doing
      compression and when it is doing concealment - in what you read, and
      in what you write.
    examples:
      - "The reassessment took three weeks. (compression: we know who did it)"
      - "There has been a reassessment. (concealment: we no longer do)"
      - "Their refusal to comment was itself informative."
      - "A failure of oversight occurred."
    items:
      - key: i1
        type: choice
        feature: discourse.organisation.information_flow
        prompt: "Which version makes it hardest to ask who is responsible? ___"
        options:
          - "There has been a failure of oversight."
          - "We failed to oversee it."
          - "The board failed to oversee it."
          - "They did not oversee it."
        answer: "There has been a failure of oversight."
        note: >
          The verb has become a noun and the agent has gone with it. The
          other three all name someone.
      - key: i2
        type: choice
        feature: discourse.organisation.information_flow
        prompt: >
          "We reassessed the timetable. The reassessment took three weeks."
          What is the second sentence doing? ___
        options:
          - "Compressing what was just said so the sentence can move on."
          - "Hiding who did the reassessing."
          - "Repeating the first sentence unnecessarily."
          - "Changing the subject."
        answer: "Compressing what was just said so the sentence can move on."
        note: >
          The agent is already established, so the nominalisation costs
          nothing and buys brevity. This is the legitimate use.
      - key: i3
        type: choice
        feature: pragmatics.attribution.source
        prompt: >
          You are writing a report and want to be accountable. Which do you
          choose? ___
        options:
          - "We decided to postpone the launch."
          - "A decision was taken to postpone the launch."
          - "There was a postponement of the launch."
          - "The launch has undergone postponement."
        answer: "We decided to postpone the launch."
        note: >
          Naming the agent is what accountability looks like in a sentence.
          The other three are progressively further from it.
      - key: i4
        type: gap_fill
        feature: lexis.word_form.derivation
        prompt: "refuse -> their ___ to comment was itself informative"
        answer: "refusal"
        note: >
          Knowing the noun form is what lets you choose it deliberately -
          or decline to.

  - key: study.c2.marked_word_order
    level: C2
    skill: grammar.stylistic_control
    title: "Putting the wrong thing first, on purpose"
    minutes: 11
    explanation: |
      English word order is fairly fixed, which is exactly why breaking it
      carries meaning. Move an element to the front and you have told the
      reader that this, specifically, is what is at issue.

      Fronting for contrast:
        "This much, at least, nobody disputes."
        (implying: other things are disputed)

      Inversion after a negative adverbial:
        "Not once did they answer the question."
        (the auxiliary comes before the subject, as in a question)

      It-clefts, which pick one element out and background everything else:
        "It was the delay that annoyed them, not the cost."

      What-clefts, which build anticipation:
        "What worries me is the maintenance."

      Each of these is doing the same job by different means: deciding what
      the reader treats as given and what as news. Used once, it lands. Used
      three times on a page, it reads as mannerism, and the emphasis stops
      meaning anything because everything is emphasised.
    examples:
      - "This much, at least, nobody disputes."
      - "Not once did they answer the question."
      - "It was the delay that annoyed them, not the cost."
      - "What worries me is the maintenance burden."
    items:
      - key: i1
        type: choice
        feature: grammar.word_order.statement
        prompt: "Which sentence fronts an element for contrast? ___"
        options:
          - "This much, at least, nobody disputes."
          - "Nobody disputes this much, at least."
          - "At least nobody disputes this much."
          - "Nobody at least disputes this much."
        answer: "This much, at least, nobody disputes."
        note: >
          The object has moved to the front. In the others the object stays
          where ordinary word order puts it.
      - key: i2
        type: gap_fill
        feature: grammar.word_order.question
        prompt: "Not once ___ they answer the question."
        answer: "did"
        note: >
          After a negative adverbial the auxiliary comes before the subject,
          exactly as in a question. Leaving it out is the usual slip.
      - key: i3
        type: choice
        feature: grammar.clause.subordination
        prompt: >
          You want to say the delay was the problem, not the cost. Which
          form does that most precisely? ___
        options:
          - "It was the delay that annoyed them."
          - "The delay annoyed them."
          - "They were annoyed by the delay."
          - "What annoyed them was annoying."
        answer: "It was the delay that annoyed them."
        note: >
          The it-cleft singles out one element as the answer to an implied
          question and backgrounds everything else. Plain order does not.
      - key: i4
        type: choice
        feature: discourse.organisation.information_flow
        prompt: "What goes wrong if every sentence on a page is marked? ___"
        options:
          - "Nothing stands out, because everything is emphasised."
          - "The sentences become ungrammatical."
          - "The register becomes too informal."
          - "The reader loses track of the tense."
        answer: "Nothing stands out, because everything is emphasised."
        note: >
          Marked order works by contrast with unmarked order. Remove the
          contrast and the device stops doing anything.
