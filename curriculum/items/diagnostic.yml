version: 0.1.0
description: >
  Deterministic diagnostic item bank. Every item is scored locally with no model
  call, so onboarding works with AI disabled. Distractors are built from known
  learner misconceptions rather than filler, per docs/LEARNING_SCIENCE.md.

  Multiple-choice items produce recognition evidence and gap-fill items produce
  controlled recall. Neither can establish productive mastery on its own; the
  writing and speaking samples in Milestone 1 supply that.

items:
  # --- A1 grammar -----------------------------------------------------------
  - key: grammar.a1.be_present
    feature: grammar.agreement.subject_verb
    type: multiple_choice
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.10
    prompt: "She ___ a teacher."
    options: ["is", "are", "am", "be"]
    answer: ["is"]
    distractors:
      are: "'are' goes with you/we/they. 'She' takes 'is'."
      am: "'am' only goes with 'I'."
      be: "'be' is the base form; it needs to change for the subject."

  - key: grammar.a1.present_simple_s
    feature: grammar.tense.present_simple_form
    type: multiple_choice
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.18
    prompt: "My brother ___ to work by bus."
    options: ["goes", "go", "going", "gone"]
    answer: ["goes"]
    distractors:
      go: "After he/she/it, present simple verbs add -s."
      going: "'going' needs a form of 'be' before it."

  - key: grammar.a1.article
    feature: grammar.article.definite_indefinite
    type: gap_fill
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.22
    instructions: "Write one word."
    prompt: "I have ___ apple in my bag."
    answer: ["an"]
    distractors:
      a: "Use 'an' before a vowel sound: an apple."

  - key: grammar.a1.question_order
    feature: grammar.word_order.question
    type: word_order
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.28
    instructions: "Put the words in order to make a question."
    prompt: "you / where / do / live"
    answer: ["where do you live"]

  # --- A2 grammar -----------------------------------------------------------
  - key: grammar.a2.past_simple
    feature: grammar.tense.past_simple_form
    type: gap_fill
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.32
    instructions: "Write the past simple of the verb in brackets."
    prompt: "We ___ (go) to the cinema last night."
    answer: ["went"]
    distractors:
      goed: "'go' is irregular: go / went / gone."
      goes: "This sentence is about last night, so it needs a past form."

  - key: grammar.a2.comparative
    feature: grammar.comparison.form
    type: gap_fill
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.36
    instructions: "Write one or two words."
    prompt: "This book is ___ (interesting) than the other one."
    answer: ["more interesting"]
    distractors:
      interestinger: "Long adjectives use 'more', not '-er'."

  - key: grammar.a2.present_perfect_intro
    feature: grammar.tense.perfect_vs_past
    type: multiple_choice
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.42
    prompt: "I ___ never been to Japan."
    options: ["have", "has", "am", "did"]
    answer: ["have"]
    distractors:
      has: "'has' goes with he/she/it. 'I' takes 'have'."
      did: "'never been' needs the present perfect, not the past simple."

  # --- B1 grammar -----------------------------------------------------------
  - key: grammar.b1.present_perfect_contrast
    feature: grammar.tense.perfect_vs_past
    type: multiple_choice
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.50
    prompt: "I ___ my keys, so I can't open the door."
    options: ["have lost", "lost", "was losing", "had lost"]
    answer: ["have lost"]
    distractors:
      lost: "The past simple states when it happened; here the result matters now."
      had lost: "The past perfect needs a second, later past event to relate to."

  - key: grammar.b1.second_conditional
    feature: grammar.conditional.form
    type: gap_fill
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.56
    instructions: "Write two words."
    prompt: "If I had more time, I ___ (learn) another language."
    answer: ["would learn", "'d learn"]
    distractors:
      will learn: "'If I had' is hypothetical, so the result clause uses 'would'."

  - key: grammar.b1.reported_speech
    feature: grammar.tense.sequence_backshift
    type: gap_fill
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.60
    instructions: "Write two words."
    prompt: "She said she ___ (be) tired."
    answer: ["was"]

  # --- B2 grammar -----------------------------------------------------------
  - key: grammar.b2.passive
    feature: grammar.passive.form
    type: gap_fill
    skill: grammar.broad_control
    level: B2
    difficulty: 0.66
    instructions: "Write two words."
    prompt: "The report ___ (finish) by Friday, so nobody needs to work this weekend."
    answer: ["was finished", "has been"]

  - key: grammar.b2.past_modal
    feature: grammar.modality.obligation
    type: multiple_choice
    skill: grammar.broad_control
    level: B2
    difficulty: 0.70
    prompt: "You ___ told me earlier — I would have helped."
    options: ["should have", "should", "must", "would"]
    answer: ["should have"]
    distractors:
      should: "'should tell' refers to now; this is a regret about the past."

  # --- C1 grammar -----------------------------------------------------------
  - key: grammar.c1.inversion
    feature: grammar.word_order.statement
    type: word_order
    skill: grammar.flexible_complexity
    level: C1
    difficulty: 0.80
    instructions: "Put the words in order to make an emphatic sentence."
    prompt: "had / no / she / sooner / arrived"
    answer: ["no sooner had she arrived"]

  - key: grammar.c1.nominalisation
    feature: lexis.word_form.derivation
    type: multiple_choice
    skill: grammar.flexible_complexity
    level: C1
    difficulty: 0.78
    prompt: "___ of the new policy took longer than expected."
    options:
      ["The implementation", "To implement", "Implementing it", "They implemented"]
    answer: ["The implementation"]

  # --- A1 vocabulary --------------------------------------------------------
  - key: vocabulary.a1.family
    feature: lexis.precision.approximation
    type: multiple_choice
    skill: vocabulary.high_frequency_survival
    level: A1
    difficulty: 0.10
    prompt: "My mother's mother is my ___."
    options: ["grandmother", "aunt", "sister", "daughter"]
    answer: ["grandmother"]

  - key: vocabulary.a1.time
    feature: lexis.precision.approximation
    type: gap_fill
    skill: vocabulary.high_frequency_survival
    level: A1
    difficulty: 0.20
    instructions: "Write one word."
    prompt: "There are seven days in a ___."
    answer: ["week"]

  # --- A2 vocabulary --------------------------------------------------------
  - key: vocabulary.a2.travel
    feature: lexis.collocation.verb_noun
    type: multiple_choice
    skill: vocabulary.everyday_topics
    level: A2
    difficulty: 0.34
    prompt: "We need to ___ a hotel before we travel."
    options: ["book", "order", "buy", "take"]
    answer: ["book"]
    distractors:
      order: "You order food; you book a room or a ticket."

  - key: vocabulary.a2.health
    feature: lexis.precision.approximation
    type: gap_fill
    skill: vocabulary.everyday_topics
    level: A2
    difficulty: 0.40
    instructions: "Write one word."
    prompt: "I don't feel well. I should see a ___."
    answer: ["doctor"]

  # --- B1 vocabulary --------------------------------------------------------
  - key: vocabulary.b1.collocation_decision
    feature: lexis.collocation.verb_noun
    type: multiple_choice
    skill: vocabulary.independent_range
    level: B1
    difficulty: 0.52
    prompt: "It took us a week to ___ a decision."
    options: ["make", "do", "take", "have"]
    answer: ["make"]
    distractors:
      do: "'do' collocates with work and tasks, not with 'a decision'."
      take: "'take a decision' exists in some varieties but 'make' is far more frequent."

  - key: vocabulary.b1.phrasal_verb
    feature: lexis.phrasal_verb.meaning
    type: gap_fill
    skill: vocabulary.independent_range
    level: B1
    difficulty: 0.58
    instructions: "Write one word."
    prompt: "I need to look ___ this word in the dictionary."
    answer: ["up"]

  # --- B2 vocabulary --------------------------------------------------------
  - key: vocabulary.b2.precision
    feature: lexis.precision.approximation
    type: multiple_choice
    skill: vocabulary.precision_collocation
    level: B2
    difficulty: 0.68
    prompt: "The evidence was ___ enough to change their minds."
    options: ["compelling", "strong-willed", "forceful", "heavy"]
    answer: ["compelling"]
    distractors:
      forceful: "'forceful' describes a person or manner, not evidence."

  - key: vocabulary.b2.register
    feature: pragmatics.register.formality
    type: multiple_choice
    skill: vocabulary.precision_collocation
    level: B2
    difficulty: 0.72
    prompt: "In a formal report, which is most appropriate?"
    options:
      - "The results indicate a significant increase."
      - "The results show things went way up."
      - "Turns out the numbers jumped."
      - "Numbers are up loads."
    answer: ["The results indicate a significant increase."]

  # --- C1 vocabulary --------------------------------------------------------
  - key: vocabulary.c1.idiomatic
    feature: lexis.confusable.pair
    type: multiple_choice
    skill: vocabulary.broad_idiomatic
    level: C1
    difficulty: 0.82
    prompt: "Her argument didn't ___ water once the data was published."
    options: ["hold", "carry", "keep", "bear"]
    answer: ["hold"]

  # --- Reading --------------------------------------------------------------
  - key: reading.a1.sign
    type: multiple_choice
    skill: reading.signs_forms
    level: A1
    difficulty: 0.14
    prompt: "A sign says 'NO ENTRY'. What does it mean?"
    options:
      ["You cannot go in.", "The shop is open.", "Entry is free.", "Please wait here."]
    answer: ["You cannot go in."]

  - key: reading.a2.message
    type: multiple_choice
    skill: reading.short_everyday_texts
    level: A2
    difficulty: 0.38
    prompt: >
      "Hi Sam — I'm running about 20 minutes late. Start without me and I'll
      join for the second half." What should Sam do?
    options:
      ["Begin now.", "Wait for the writer.", "Cancel the meeting.", "Leave early."]
    answer: ["Begin now."]

  - key: reading.b1.inference
    type: multiple_choice
    skill: reading.familiar_arguments
    level: B1
    difficulty: 0.55
    prompt: >
      "The café had changed hands again. The coffee was cheaper now, though
      regulars had stopped coming." What does the writer suggest?
    options:
      - "Quality probably fell despite the lower price."
      - "The café became more popular."
      - "The coffee improved."
      - "Prices went up."
    answer: ["Quality probably fell despite the lower price."]

  - key: reading.b2.stance
    type: multiple_choice
    skill: reading.complex_contemporary
    level: B2
    difficulty: 0.70
    prompt: >
      "Proponents claim the scheme will pay for itself — an assertion that
      remains, at best, untested." What is the writer's stance?
    options: ["Sceptical", "Enthusiastic", "Neutral and factual", "Alarmed"]
    answer: ["Sceptical"]

  # --- Written production ---------------------------------------------------
  # Scored by countable checks only (length, sentences, connectives, required
  # content). These confirm the learner produced language; they cannot judge
  # accuracy, so the evidence is recorded at reduced evaluator confidence and
  # marked provisional until a rubric evaluator runs. See learning/writing.py.
  - key: writing.a1.about_me
    type: written_response
    skill: writing.basic_sentences
    level: A1
    difficulty: 0.20
    instructions: "Write 3 to 5 short sentences. Simple language is fine."
    prompt: >
      Tell us about yourself. Where do you live, and what do you do on a normal day?
    requirements:
      min_words: 25
      max_words: 120
      min_sentences: 3
      min_connectives: 1

  - key: writing.a2.last_weekend
    type: written_response
    skill: writing.linked_messages
    level: A2
    difficulty: 0.38
    instructions: >
      Write about 50 words. Use past forms, and mention the word 'because'
      at least once to explain a reason.
    prompt: >
      What did you do last weekend? Say what you did, who you were with, and
      whether you enjoyed it.
    requirements:
      min_words: 40
      max_words: 160
      min_sentences: 3
      min_connectives: 2
      required_elements: ["because"]

  - key: writing.b1.opinion_message
    type: written_response
    skill: writing.connected_genres
    level: B1
    difficulty: 0.55
    instructions: >
      Write about 80 words, organised into more than one idea.
    prompt: >
      A friend is thinking of moving to your city. Write a message giving your
      opinion: what is good about living there, what is difficult, and what you
      would advise them to do.
    requirements:
      min_words: 60
      max_words: 220
      min_sentences: 4
      min_connectives: 3

  - key: writing.b2.argument
    type: written_response
    skill: writing.clear_detailed_argument
    level: B2
    difficulty: 0.70
    instructions: >
      Write about 120 words. Present a position, support it, and acknowledge
      the other side.
    prompt: >
      Some employers now expect staff to be reachable outside working hours.
      Do you think that is reasonable? Give your view, support it with a
      reason, and respond to one argument against it.
    requirements:
      min_words: 90
      max_words: 300
      min_sentences: 5
      min_connectives: 4
      required_elements: ["however"]

  # --- Self-assessment (seeds item selection; never establishes mastery) -----
  - key: self.speaking.sustained
    type: self_assessment
    skill: speaking.simple_description
    level: A2
    difficulty: 0.30
    instructions: "Rate 0 (not at all) to 4 (easily)."
    prompt: "I can describe my daily routine for a minute without preparing."

  - key: self.listening.conversation
    type: self_assessment
    skill: listening.routine_messages
    level: A2
    difficulty: 0.30
    instructions: "Rate 0 (not at all) to 4 (easily)."
    prompt: "I can follow a slow conversation between two people about everyday plans."

  - key: self.writing.connected
    type: self_assessment
    skill: writing.linked_messages
    level: A2
    difficulty: 0.30
    instructions: "Rate 0 (not at all) to 4 (easily)."
    prompt: "I can write a short message linking several sentences with 'and', 'but', 'because'."

  - key: self.interaction.unprepared
    type: self_assessment
    skill: interaction.unprepared_familiar
    level: B1
    difficulty: 0.50
    instructions: "Rate 0 (not at all) to 4 (easily)."
    prompt: "I can take part in an unprepared conversation on a familiar topic."

  - key: self.pronunciation.understood
    type: self_assessment
    skill: pronunciation.phrase_rhythm
    level: A2
    difficulty: 0.30
    instructions: "Rate 0 (not at all) to 4 (easily)."
    prompt: "People usually understand me without asking me to repeat myself."

  # =========================================================================
  # Expansion, 2026-07-28.
  #
  # This bank had become a functional constraint rather than merely a thin
  # one. Benchmarks draw from it and require items the learner has **never
  # seen** (`apps/api/app/learning/benchmarks.py`), and there were 27 closed
  # items in total. A diagnostic consumes a dozen or more; a benchmark takes
  # eight. So a learner got one benchmark and then met "there is not enough
  # material you have never seen" for ever after -- a measurement that
  # switches itself off after a single use.
  #
  # There were also no C2 items at all, so the diagnostic could not route
  # anyone above C1 and a benchmark could not be pitched there.
  #
  # Closed types only below, deliberately: benchmarks may use nothing else,
  # since full evaluator confidence is defensible only where the answer is
  # known in advance.
  #
  # Distractors are misconceptions, not filler. A wrong option nobody would
  # choose measures nothing, and one chosen at random tells you the learner
  # guessed rather than what they believe.
  # =========================================================================

  # --- A1 -------------------------------------------------------------------
  - key: grammar.a1.plural_form
    feature: grammar.noun.countability
    type: multiple_choice
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.14
    prompt: "I have two ___."
    options: ["children", "childs", "childrens", "child"]
    answer: ["children"]
    distractors:
      childs: "'child' is irregular; it does not take -s."
      childrens: "'children' is already plural, so it needs no second -s."
      child: "'two' needs a plural noun."

  - key: grammar.a1.preposition_time
    feature: grammar.preposition.time_place
    type: gap_fill
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.22
    prompt: "The class starts ___ nine o'clock."
    answer: ["at"]

  - key: lexis.a1.days
    feature: null
    type: multiple_choice
    skill: vocabulary.high_frequency_survival
    level: A1
    difficulty: 0.12
    prompt: "Which day comes after Tuesday?"
    options: ["Wednesday", "Monday", "Thursday", "Sunday"]
    answer: ["Wednesday"]
    distractors:
      Monday: "Monday comes before Tuesday."
      Thursday: "Thursday comes two days after Tuesday."

  - key: grammar.a1.question_word
    feature: grammar.word_order.question
    type: multiple_choice
    skill: grammar.basic_clause
    level: A1
    difficulty: 0.24
    prompt: "___ do you live?"
    options: ["Where", "What", "Who", "When"]
    answer: ["Where"]
    distractors:
      What: "'What' asks about a thing, not a place."
      Who: "'Who' asks about a person."
      When: "'When' asks about a time."

  # --- A2 -------------------------------------------------------------------
  - key: grammar.a2.past_irregular
    feature: grammar.tense.past_simple_form
    type: gap_fill
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.34
    prompt: "Yesterday I ___ (go) to the market."
    answer: ["went"]

  - key: grammar.a2.comparative_short
    feature: grammar.comparison.form
    type: multiple_choice
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.32
    prompt: "This road is ___ than the other one."
    options: ["busier", "more busy", "busiest", "busy"]
    answer: ["busier"]
    distractors:
      more busy: "Short adjectives take -er rather than 'more'."
      busiest: "'-est' is the superlative; 'than' needs a comparative."
      busy: "The base form cannot be used with 'than'."

  - key: grammar.a2.countable
    feature: grammar.quantifier.choice
    type: multiple_choice
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.38
    prompt: "There isn't ___ milk left."
    options: ["much", "many", "a few", "several"]
    answer: ["much"]
    distractors:
      many: "'many' goes with things you can count; milk is uncountable."
      a few: "'a few' also needs a countable noun."
      several: "'several' needs a countable noun."

  - key: lexis.a2.collocation_make
    feature: lexis.collocation.verb_noun
    type: multiple_choice
    skill: vocabulary.everyday_topics
    level: A2
    difficulty: 0.40
    prompt: "I need to ___ an appointment with the doctor."
    options: ["make", "do", "take", "put"]
    answer: ["make"]
    distractors:
      do: "'do' collocates with tasks and work, not appointments."
      take: "'take an appointment' is not used; you take a seat, not an appointment."
      put: "'put' needs a place or a direction."

  - key: grammar.a2.word_order_adverb
    feature: grammar.word_order.statement
    type: word_order
    skill: grammar.past_future_basic
    level: A2
    difficulty: 0.42
    prompt: "Put the words in order: always / she / late / is"
    answer: ["she is always late"]

  # --- B1 -------------------------------------------------------------------
  - key: grammar.b1.present_perfect_since
    feature: grammar.tense.perfect_vs_past
    type: gap_fill
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.48
    prompt: "I ___ (live) here since 2019."
    answer: ["have lived", "'ve lived"]

  - key: grammar.b1.conditional_second
    feature: grammar.conditional.form
    type: multiple_choice
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.52
    prompt: "If I had more time, I ___ take the course."
    options: ["would", "will", "am going to", "had"]
    answer: ["would"]
    distractors:
      will: "'will' pairs with a present tense 'if' clause, not a past one."
      am going to: "The same problem: this describes a real future plan."
      had: "This would repeat the past form rather than complete the sentence."

  - key: lexis.b1.confusable_lend
    feature: lexis.confusable.pair
    type: multiple_choice
    skill: vocabulary.independent_range
    level: B1
    difficulty: 0.50
    prompt: "Could you ___ me your pen for a moment?"
    options: ["lend", "borrow", "loan out", "rent"]
    answer: ["lend"]
    distractors:
      borrow: "You borrow *from* someone; they lend *to* you. The subject here is the giver."
      loan out: "Possible but formal and unusual in speech."
      rent: "Renting involves payment."

  - key: grammar.b1.relative_clause
    feature: grammar.clause.relative
    type: multiple_choice
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.54
    prompt: "The colleague ___ sent the message is away today."
    options: ["who", "which", "whose", "whom"]
    answer: ["who"]
    distractors:
      which: "'which' refers to things, not people."
      whose: "'whose' shows possession; nothing here belongs to the colleague."
      whom: "'whom' is the object form, but the colleague is doing the sending."

  - key: discourse.b1.connective_contrast
    feature: discourse.cohesion.connective
    type: multiple_choice
    skill: grammar.connected_time_modality
    level: B1
    difficulty: 0.56
    prompt: "It rained all day. ___, we still went for a walk."
    options: ["However", "Therefore", "Because", "For example"]
    answer: ["However"]
    distractors:
      Therefore: "'Therefore' signals a result, and this is a contrast."
      Because: "'Because' introduces a reason and cannot start this clause."
      For example: "Nothing here is being illustrated."

  # --- B2 -------------------------------------------------------------------
  - key: grammar.b2.past_perfect_sequence
    feature: grammar.tense.sequence_backshift
    type: gap_fill
    skill: grammar.broad_control
    level: B2
    difficulty: 0.62
    prompt: "By the time we arrived, the meeting ___ (already / finish)."
    answer: ["had already finished"]

  - key: grammar.b2.passive_flow
    feature: grammar.passive.form
    type: multiple_choice
    skill: grammar.broad_control
    level: B2
    difficulty: 0.64
    prompt: >
      The previous sentence was about the report. Which continuation keeps
      the report as the subject?
    options:
      - "The report was praised by both reviewers."
      - "Both reviewers praised the report."
      - "There was praise for the report."
      - "Praise came from both reviewers."
    answer: ["The report was praised by both reviewers."]
    distractors:
      Both reviewers praised the report.: "Grammatical, but it moves the reviewers into subject position and breaks the flow."
      There was praise for the report.: "This buries both the report and the reviewers."

  - key: lexis.b2.collocation_draw
    feature: lexis.collocation.verb_noun
    type: multiple_choice
    skill: vocabulary.precision_collocation
    level: B2
    difficulty: 0.66
    prompt: "It is too early to ___ a conclusion from one study."
    options: ["draw", "make", "take", "do"]
    answer: ["draw"]
    distractors:
      make: "'make a conclusion' is a very common learner error; the verb is 'draw'."
      take: "'take a conclusion' is not used in English."
      do: "'do' does not collocate with conclusion."

  - key: pragmatics.b2.hedging
    feature: pragmatics.stance.hedging
    type: multiple_choice
    skill: pragmatics.register_choice
    level: B2
    difficulty: 0.68
    prompt: >
      One small study found an association. Which sentence reports it
      accurately?
    options:
      - "The results suggest a link, though the study was small."
      - "The study proves that journals improve sleep."
      - "It is now known that journals cure insomnia."
      - "Journals have been shown to help everyone sleep."
    answer: ["The results suggest a link, though the study was small."]
    distractors:
      The study proves that journals improve sleep.: "'Proves' claims far more than one small study can support."
      It is now known that journals cure insomnia.: "This states as settled what was only an association."

  - key: grammar.b2.modal_deduction
    feature: grammar.modality.obligation
    type: multiple_choice
    skill: grammar.broad_control
    level: B2
    difficulty: 0.60
    prompt: "The lights are off, so they ___ have left already."
    options: ["must", "can", "should", "would"]
    answer: ["must"]
    distractors:
      can: "'can have' is not used for deduction about the past."
      should: "'should have' expresses expectation or regret, not deduction."
      would: "'would have' belongs to a hypothetical, not an inference from evidence."

  # --- C1 -------------------------------------------------------------------
  - key: discourse.c1.cleft
    feature: grammar.clause.subordination
    type: gap_fill
    skill: grammar.flexible_complexity
    level: C1
    difficulty: 0.74
    prompt: "___ was the delay that annoyed them, not the cost. (cleft with 'it')"
    answer: ["it"]

  - key: pragmatics.c1.attribution
    feature: pragmatics.attribution.source
    type: multiple_choice
    skill: pragmatics.nuance
    level: C1
    difficulty: 0.76
    prompt: >
      You worked out that two figures conflict. Neither source says so.
      Which sentence is honest?
    options:
      - "The two figures cannot both be right, though neither source says so."
      - "The report says the two figures cannot both be right."
      - "As both sources point out, the figures conflict."
      - "Everyone agrees the figures conflict."
    answer: ["The two figures cannot both be right, though neither source says so."]
    distractors:
      The report says the two figures cannot both be right.: "This attributes your inference to a source that never made it."
      As both sources point out, the figures conflict.: "Neither source pointed it out; you did."

  - key: lexis.c1.idiom_goalposts
    feature: lexis.idiom.figurative
    type: multiple_choice
    skill: vocabulary.broad_idiomatic
    level: C1
    difficulty: 0.72
    prompt: "'They moved the goalposts' means that they ___."
    options:
      - "changed the requirements after work had started"
      - "relocated some equipment"
      - "postponed the decision"
      - "made the task easier"
    answer: ["changed the requirements after work had started"]
    distractors:
      relocated some equipment: "The literal reading; the phrase is figurative."
      postponed the decision: "That would be 'kicked it into the long grass'."

  - key: discourse.c1.information_flow
    feature: discourse.organisation.information_flow
    type: multiple_choice
    skill: grammar.flexible_complexity
    level: C1
    difficulty: 0.78
    prompt: "Which pair of sentences flows better for a reader?"
    options:
      - "The lease costs £61,000. That is the second largest line after salaries."
      - "The second largest line after salaries is £61,000. The lease costs that."
      - "£61,000 is what the lease costs. Salaries are larger."
      - "Salaries are the largest line. £61,000."
    answer: ["The lease costs £61,000. That is the second largest line after salaries."]
    distractors:
      The second largest line after salaries is £61,000. The lease costs that.: "This makes the reader hold a figure before knowing what it refers to."

  # --- C2 -------------------------------------------------------------------
  #
  # The bank had none. Without them the diagnostic cannot route anyone above
  # C1 and a benchmark cannot be pitched at the top band, which makes C2 a
  # level the product describes and cannot assess.
  - key: pragmatics.c2.irony
    feature: pragmatics.rhetoric.irony
    type: multiple_choice
    skill: pragmatics.mastery
    level: C2
    difficulty: 0.84
    prompt: >
      A manager says "I have one or two reservations about the whole plan."
      What is the likeliest meaning?
    options:
      - "Serious objections, put mildly."
      - "Exactly two small points of detail."
      - "Full agreement with the plan."
      - "They have not read the plan."
    answer: ["Serious objections, put mildly."]
    distractors:
      Exactly two small points of detail.: "Reading the understatement literally is the failure this tests."
      Full agreement with the plan.: "The hedge signals the opposite."

  - key: lexis.c2.fine_shade
    feature: lexis.precision.approximation
    type: multiple_choice
    skill: vocabulary.fine_shades
    level: C2
    difficulty: 0.86
    prompt: >
      "The change was ___ about cost." Which word implies the stated reason
      may not be the real one?
    options: ["ostensibly", "evidently", "undeniably", "primarily"]
    answer: ["ostensibly"]
    distractors:
      evidently: "'Evidently' asserts the reason is clear, not that it is doubtful."
      undeniably: "This strengthens the claim rather than casting doubt on it."
      primarily: "This ranks reasons; it does not question them."

  - key: grammar.c2.marked_order
    feature: grammar.word_order.statement
    type: multiple_choice
    skill: grammar.stylistic_control
    level: C2
    difficulty: 0.88
    prompt: "Which sentence fronts an element for contrast?"
    options:
      - "This much, at least, nobody disputes."
      - "Nobody disputes this much, at least."
      - "At least nobody disputes this much."
      - "Nobody at least disputes this much."
    answer: ["This much, at least, nobody disputes."]
    distractors:
      Nobody disputes this much, at least.: "Ordinary order; nothing is fronted."
      At least nobody disputes this much.: "The adverbial moves, but the object stays in place."

  - key: pragmatics.c2.attribution_hedge
    feature: pragmatics.attribution.source
    type: multiple_choice
    skill: pragmatics.mastery
    level: C2
    difficulty: 0.90
    prompt: >
      "Listeners may have drawn a firmer conclusion than was warranted."
      Where does this place the responsibility?
    options:
      - "On the listeners, while appearing to concede the point."
      - "On the speaker, clearly and without qualification."
      - "On circumstances that changed later."
      - "On whoever reported the statement."
    answer: ["On the listeners, while appearing to concede the point."]
    distractors:
      On the speaker, clearly and without qualification.: "The grammar makes the listeners the ones who drew the conclusion."
      On circumstances that changed later.: "No circumstance is mentioned in this sentence."

  - key: discourse.c2.nominalisation
    feature: discourse.organisation.information_flow
    type: multiple_choice
    skill: grammar.stylistic_control
    level: C2
    difficulty: 0.85
    prompt: >
      Which version makes the claim hardest to challenge, by removing who
      did what?
    options:
      - "There has been a reassessment of the timetable."
      - "We have reassessed the timetable."
      - "The board reassessed the timetable."
      - "They are reassessing the timetable."
    answer: ["There has been a reassessment of the timetable."]
    distractors:
      We have reassessed the timetable.: "This names the agent, so it can be questioned."
      The board reassessed the timetable.: "Also names the agent."
